<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Today's Reading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c2a32;
      --muted: #5a6d78;
      --paper: #fffdf8;
      --line: rgba(28, 42, 50, 0.08);
      --leaf: #2f8f6b;
      --shadow: 0 18px 50px rgba(31, 74, 104, 0.12);
      --ui-font: "Nunito", system-ui, sans-serif;
      --read-font: "Source Serif 4", Georgia, serif;
      --display-font: "Fraunces", Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--ui-font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 55% at 10% -10%, #ffe8c8 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 0%, #cfefff 0%, transparent 50%),
        linear-gradient(180deg, #f3f9fd 0%, #eef6f1 100%);
    }

    .wrap {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 20px 0 64px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .tab.active {
      background: var(--leaf);
      border-color: var(--leaf);
      color: #fff;
    }

    .status {
      display: none;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 750;
      background: #e8f3f8;
      color: #1f5c73;
    }

    .status.show { display: block; }
    .status.error { background: #fdeceb; color: #9a3228; }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px 26px 32px;
    }

    .kicker {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--leaf);
      margin-bottom: 8px;
    }

    .meta { color: var(--muted); font-weight: 750; margin-bottom: 14px; }

    h1 {
      font-family: var(--display-font);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .hero {
      display: block;
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 16px;
      margin: 8px 0 18px;
    }

    .notification { font-weight: 750; color: #3d5563; margin-bottom: 18px; line-height: 1.45; }

    .article {
      font-family: var(--read-font);
      font-size: 1.08rem;
      line-height: 1.75;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    blockquote {
      margin: 0 0 20px;
      padding: 14px 16px;
      border-left: 4px solid var(--leaf);
      background: #f4faf7;
      border-radius: 0 14px 14px 0;
      font-family: var(--read-font);
      font-style: italic;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }

    .card h2 {
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card p { font-weight: 650; line-height: 1.5; }

    .empty {
      color: var(--muted);
      font-weight: 750;
      line-height: 1.5;
    }

    .answer-btn {
      border: 0;
      background: var(--leaf);
      color: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .eminence + .eminence {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .read-more {
      display: inline-block;
      margin-top: 8px;
      color: var(--leaf);
      font-weight: 800;
    }

    footer {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 750;
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      .panel { padding: 22px 16px; }
      .wrap { padding-top: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="tabs" aria-label="Daily reading">
      <button type="button" class="tab active" data-tab="article">Daily Article</button>
      <button type="button" class="tab" data-tab="fact">Smart Fact</button>
      <button type="button" class="tab" data-tab="teaser">Brain Teaser</button>
      <button type="button" class="tab" data-tab="eminence">Day Eminence</button>
    </nav>

    <div id="status" class="status" role="status"></div>

    <main class="panel">
      <article id="tab-article">
        <div id="article-content" hidden>
          <div class="kicker" id="series"></div>
          <div class="meta" id="fullDate"></div>
          <h1 id="title"></h1>
          <p class="notification" id="notification"></p>
          <div class="article" id="article"></div>
          <blockquote id="quote"></blockquote>
          <div class="grid">
            <section class="card">
              <h2>Takeaway</h2>
              <p id="moral"></p>
            </section>
            <section class="card">
              <h2>Ask yourself</h2>
              <p id="question"></p>
            </section>
            <section class="card">
              <h2>Try this</h2>
              <p id="activity"></p>
            </section>
            <section class="card">
              <h2>Today’s step</h2>
              <p id="challenge"></p>
            </section>
          </div>
        </div>
        <p id="article-empty" class="empty" hidden>No daily article for this day.</p>
      </article>

      <article id="tab-fact" hidden>
        <div id="fact-content" hidden>
          <div class="kicker">Smart Fact</div>
          <div class="meta" id="factDate"></div>
          <h1 id="factTitle"></h1>
          <img id="factImage" class="hero" alt="" hidden />
          <div class="article" id="factArticle"></div>
        </div>
        <p id="fact-empty" class="empty" hidden>No smart fact for this day.</p>
      </article>

      <article id="tab-teaser" hidden>
        <div id="teaser-content" hidden>
          <div class="kicker">Brain Teaser</div>
          <div class="meta" id="teaserDate"></div>
          <h1 id="teaserTitle"></h1>
          <img id="teaserImage" class="hero" alt="" hidden />
          <div class="article" id="teaserArticle"></div>
          <button type="button" id="teaserAnswerBtn" class="answer-btn" hidden>Show answer</button>
          <blockquote id="teaserAnswer" hidden></blockquote>
        </div>
        <p id="teaser-empty" class="empty" hidden>No brain teaser for this day.</p>
      </article>

      <article id="tab-eminence" hidden>
        <div id="eminence-content"></div>
        <p id="eminence-empty" class="empty" hidden>No day eminence for this day.</p>
      </article>
    </main>
    <footer>Today’s reading · One idea for every day</footer>
  </div>

  <script>
    const DATA_URL = "https://schoolvertex.github.io/Pages/Daily-Article/data.json";
    const PROD_API = "https://api.schoolvertex.com/api";
    const LOCAL_API = "http://localhost:5000/api";

    function isLocalHost() {
      const host = window.location.hostname;
      return window.location.protocol === "file:"
        || host === "localhost"
        || host === "127.0.0.1"
        || host === "";
    }

    function resolveApiBase() {
      const fromQuery = new URLSearchParams(window.location.search).get("api");
      if (fromQuery) {
        return fromQuery.replace(/\/$/, "");
      }
      return isLocalHost() ? LOCAL_API : PROD_API;
    }

    const API_BASE = resolveApiBase();

    function pad(n) { return String(n).padStart(2, "0"); }

    function todayKey(date) {
      return pad(date.getMonth() + 1) + "-" + pad(date.getDate());
    }

    function normalizeDayParam(raw) {
      if (!raw) return null;
      const text = String(raw).trim().replace(/[\/.]/g, "-");
      const match = text.match(/^(\d{1,2})-(\d{1,2})$/);
      if (!match) return null;
      const month = Number(match[1]);
      const day = Number(match[2]);
      if (month < 1 || month > 12 || day < 1 || day > 31) return null;
      const probe = new Date(2026, month - 1, day);
      if (probe.getMonth() !== month - 1 || probe.getDate() !== day) return null;
      return pad(month) + "-" + pad(day);
    }

    function articleKey() {
      const params = new URLSearchParams(window.location.search);
      const fromQuery = normalizeDayParam(params.get("day"));
      return fromQuery || todayKey(new Date());
    }

    function formatDate(key) {
      const [m, d] = key.split("-").map(Number);
      const dt = new Date(new Date().getFullYear(), m - 1, d);
      return dt.toLocaleDateString(undefined, {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    }

    function setStatus(message, isError) {
      const box = document.getElementById("status");
      box.textContent = message || "";
      box.className = "status" + (message ? " show" : "") + (isError ? " error" : "");
    }

    function showTab(name) {
      document.querySelectorAll(".tab").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === name);
      });
      ["article", "fact", "teaser", "eminence"].forEach(function (tab) {
        document.getElementById("tab-" + tab).hidden = tab !== name;
      });
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value || "";
    }

    function showArticle(item, key) {
      setText("series", item.series || item.category || "");
      setText("fullDate", formatDate(key));
      setText("title", item.title || "");
      setText("notification", item.notification || "");
      setText("article", item.article || "");
      setText("quote", item.quote || "");
      setText("moral", item.moral || "");
      setText("question", item.question || "");
      setText("activity", item.activity || "");
      setText("challenge", item.challenge || "");
      document.getElementById("article-content").hidden = false;
      document.getElementById("article-empty").hidden = true;
    }

    function showReading(elPrefix, title, dateText, imageUrl, body) {
      setText(elPrefix + "Title", title || "Untitled");
      setText(elPrefix + "Date", dateText);
      setText(elPrefix + "Article", body || "");
      var img = document.getElementById(elPrefix + "Image");
      if (imageUrl) {
        img.src = imageUrl;
        img.hidden = false;
      } else {
        img.removeAttribute("src");
        img.hidden = true;
      }
      document.getElementById(elPrefix === "fact" ? "fact-content" : "teaser-content").hidden = false;
    }

    function renderEminence(items, key) {
      var host = document.getElementById("eminence-content");
      host.innerHTML = "";
      (items || []).forEach(function (item) {
        var block = document.createElement("section");
        block.className = "eminence";
        var kicker = document.createElement("div");
        kicker.className = "kicker";
        kicker.textContent = "Day Eminence";
        var meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = formatDate(key);
        var heading = document.createElement("h1");
        heading.textContent = item.Title || "";
        block.appendChild(kicker);
        block.appendChild(meta);
        block.appendChild(heading);
        if (item.Image) {
          var img = document.createElement("img");
          img.className = "hero";
          img.alt = item.Title || "Day eminence";
          img.src = item.Image;
          block.appendChild(img);
        }
        var body = document.createElement("div");
        body.className = "article";
        body.textContent = item.Description || "";
        block.appendChild(body);
        if (item.BlogUrl) {
          var link = document.createElement("a");
          link.className = "read-more";
          link.href = item.BlogUrl;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = "Read more";
          block.appendChild(link);
        }
        host.appendChild(block);
      });
    }

    async function loadArticle(key) {
      const controller = new AbortController();
      const timer = setTimeout(function () { controller.abort(); }, 8000);
      const res = await fetch(DATA_URL, { cache: "no-store", signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const list = await res.json();
      const item = (list || []).find(function (row) { return row && row.date === key; });
      if (!item) {
        document.getElementById("article-empty").hidden = false;
        return;
      }
      showArticle(item, key);
    }

    async function loadDayReading(key) {
      const parts = key.split("-").map(Number);
      const month = parts[0];
      const day = parts[1];
      const res = await fetch(
        API_BASE + "/DailyActivity/GetDayReading?day=" + day + "&month=" + month,
        { cache: "no-store" }
      );
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const dateText = formatDate(key);

      if (data && data.SmartFact && data.SmartFact.SmartFactId) {
        showReading(
          "fact",
          data.SmartFact.Title,
          dateText,
          data.SmartFact.Url,
          data.SmartFact.Description || data.SmartFact.Text
        );
        document.getElementById("fact-empty").hidden = true;
      } else {
        document.getElementById("fact-empty").hidden = false;
      }

      if (data && data.BrainTeaser && data.BrainTeaser.BrainTeaserId) {
        showReading(
          "teaser",
          data.BrainTeaser.Title,
          dateText,
          data.BrainTeaser.IsVideo ? "" : data.BrainTeaser.Url,
          data.BrainTeaser.Description || ""
        );
        var answer = data.BrainTeaser.Text || "";
        var answerBtn = document.getElementById("teaserAnswerBtn");
        var answerBox = document.getElementById("teaserAnswer");
        if (answer) {
          answerBox.textContent = answer;
          answerBtn.hidden = false;
          answerBox.hidden = true;
          answerBtn.onclick = function () {
            answerBox.hidden = !answerBox.hidden;
            answerBtn.textContent = answerBox.hidden ? "Show answer" : "Hide answer";
          };
        }
        document.getElementById("teaser-empty").hidden = true;
      } else {
        document.getElementById("teaser-empty").hidden = false;
      }

      var eminence = (data && data.DaySignificances) || [];
      if (eminence.length) {
        renderEminence(eminence, key);
        document.getElementById("eminence-empty").hidden = true;
      } else {
        document.getElementById("eminence-empty").hidden = false;
      }
    }

    async function load() {
      const key = articleKey();
      document.querySelectorAll(".tab").forEach(function (btn) {
        btn.addEventListener("click", function () {
          showTab(btn.getAttribute("data-tab"));
        });
      });

      try {
        await loadArticle(key);
      } catch (err) {
        document.getElementById("article-empty").hidden = false;
        setStatus("Could not load today’s parent article.", true);
        console.error(err);
      }

      try {
        await loadDayReading(key);
      } catch (err) {
        document.getElementById("fact-empty").hidden = false;
        document.getElementById("teaser-empty").hidden = false;
        document.getElementById("eminence-empty").hidden = false;
        console.error(err);
      }
    }

    load();
  </script>
</body>
</html>
