<!DOCTYPE html>
<html lang="en" ng-app="myApp">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff ID Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --school-color: #9C27B0;
      --text-color: black;
      --school-name-font-size: 13px;
      --staff-photo-height: 100px;
      --staff-photo-border-radius: 50%;
      --staff-photo-object-fit: cover;
      --principal-sign-height: 20px;
      --bg-image-opacity: 1;
      --school-name-line1-font-size: 13px;
      --school-name-line1-font-family: Arial, Helvetica, sans-serif;
      --school-name-line2-font-size: 11px;
      --school-name-line2-font-family: Arial, Helvetica, sans-serif;
      /* Exact PVC print size (printer: 57.2×91.5mm) · Text Part: 50×82mm · text safe inset: 6mm */
      --id-card-width: 57.2mm;
      --id-card-height: 91.5mm;
      --id-text-part-width: 50mm;
      --id-text-part-height: 82mm;
      --id-safe-inset: 6mm;
      /* (91.5 - 82) / 2 = 4.75mm · (57.2 - 50) / 2 = 3.6mm · pad so text is 6mm from edge */
      --id-text-part-margin-y: 4.75mm;
      --id-text-part-padding-y: 1.25mm;
      --id-text-part-padding-x: 2.4mm;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #e9eef2;
      margin: 0;
      padding: 0;
      display: block !important;
    }

    .school-name-two-line {
      display: block;
      line-height: 1.15;
      font-weight: 700;
    }

    .school-name-two-line .school-name-line1 {
      display: block;
      font-family: var(--school-name-line1-font-family, Arial, Helvetica, sans-serif);
      font-size: var(--school-name-line1-font-size, 13px);
    }

    .school-name-two-line .school-name-line2 {
      display: block;
      font-family: var(--school-name-line2-font-family, Arial, Helvetica, sans-serif);
      font-size: var(--school-name-line2-font-size, 11px);
    }

    .id-card {
      width: var(--id-card-width);
      height: var(--id-card-height);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      background: #fff;
      margin: 0 auto;
      page-break-after: always;
      break-after: page;
      box-sizing: border-box;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: var(--bg-image-opacity, 1);
      z-index: 0;
    }

    /* Text Part 50×82mm centered in card; inner padding keeps text 6mm from outer edges */
    .main-content {
      width: var(--id-text-part-width);
      height: var(--id-text-part-height);
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: var(--id-text-part-margin-y) auto;
      padding: var(--id-text-part-padding-y) var(--id-text-part-padding-x);
      border-radius: 10px;
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      overflow: hidden;
    }

    .school-info {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      color: #2c3e50;
      padding-bottom: 0;
      border-bottom: none;
      text-align: center;
      margin-bottom: 0;
    }

    .school-logo img {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 0;
      object-fit: cover;
    }

    .school-name {
      font-size: var(--school-name-font-size, 13px);
      font-weight: 700;
      line-height: 1;
      color: var(--school-color);
      flex: 1;
      min-width: 0;
    }

    .school-header-meta {
      text-align: center;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--school-color);
      width: 100%;
    }

    .school-caption,
    .school-affliate,
    .school-address {
      font-size: 7px;
      font-weight: 600;
      font-style: italic;
      color: var(--text-color);
    }

    .school-address {
      font-size: 6px;
      font-weight: bold;
      font-style: normal;
    }

    .staff-photo-area {
      width: var(--staff-photo-height);
      height: var(--staff-photo-height);
      border-radius: var(--staff-photo-border-radius);
      border: 3px solid #fff;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      flex-shrink: 0;
      overflow: hidden;
      margin-top: 5px;
    }

    .staff-photo-area img {
      width: 100%;
      height: 100%;
      object-fit: var(--staff-photo-object-fit, cover);
      display: block;
    }

    .staff-name {
      margin-top: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--school-color);
      text-align: center;
      width: 95%;
      line-height: 1.2;
    }

    .designation {
      font-size: 12px;
      font-weight: 600;
      color: #FF5722;
      text-align: center;
      margin-top: 2px;
    }

    .staff-info {
      text-align: left;
      padding: 5px;
      width: 90%;
    }

    .info-row {
      display: flex;
      margin-bottom: 5px;
      font-size: 8px;
      color: #000;
      font-weight: 600;
    }

    .info-label {
      font-weight: 600;
      width: 48px;
      color: var(--school-color);
      flex-shrink: 0;
    }

    .info-devider {
      margin-right: 3px;
    }

    .info-value {
      color: var(--text-color);
      word-break: break-word;
    }

    .principal-signature-area {
      color: #000;
      text-align: center;
      margin-top: auto;
      padding-bottom: 4px;
      flex-shrink: 0;
    }

    .principal-sign {
      margin: -6px;
      min-height: 12px;
    }

    .principal-sign img {
      height: var(--principal-sign-height);
      max-width: 90px;
      object-fit: contain;
    }

    .principal-label {
      font-size: 8px;
      letter-spacing: 0.5px;
      border-top: 1px solid #000;
      color: var(--text-color);
    }

    @media print {
      html,
      body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 57.2mm !important;
        min-height: 91.5mm;
        height: auto !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .id-card {
        width: 57.2mm !important;
        height: 91.5mm !important;
        min-width: 57.2mm !important;
        min-height: 91.5mm !important;
        max-width: 57.2mm !important;
        max-height: 91.5mm !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid;
        break-inside: avoid;
        transform: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .bg-image {
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background-size: cover !important;
        background-position: center !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .main-content {
        width: var(--id-text-part-width);
        height: var(--id-text-part-height);
        margin: var(--id-text-part-margin-y) auto;
        padding: var(--id-text-part-padding-y) var(--id-text-part-padding-x);
        box-sizing: border-box;
        outline: none !important;
      }
    }

    @page {
      size: 57.2mm 91.5mm;
      margin: 0;
    }
  </style>
</head>

<body ng-controller="myCtrl">

  <!-- Single Card -->
  <div class="id-card" ng-if="userInfo && !userList.length">
    <div ng-include="'id-card-template.html'"></div>
  </div>

  <!-- Bulk Cards -->
  <div class="id-card" ng-repeat="userInfo in userList">
    <div ng-include="'id-card-template.html'"></div>
  </div>

  <!-- Shared Card Template -->
  <script type="text/ng-template" id="id-card-template.html">
    <div class="bg-image" ng-style="bgStyle"></div>

    <div class="main-content">
      <div class="school-info">
        <div class="school-logo">
          <img ng-src="{{org.Image}}" alt="School Logo">
        </div>
        <div class="school-name">
          <span class="school-name-two-line" ng-if="useTwoLineSchoolName">
            <span class="school-name-line1">{{schoolNameLine1}}</span>
            <span class="school-name-line2" ng-if="schoolNameLine2">{{schoolNameLine2}}</span>
          </span>
          <span ng-if="!useTwoLineSchoolName">{{org.Name}}</span>
        </div>
      </div>

      <div class="school-header-meta">
        <p class="school-affliate" ng-if="org.Description">{{org.Description}}</p>
        <p class="school-affliate" ng-if="org.AffiliationInfo">{{org.AffiliationInfo}}</p>
        <p class="school-address" ng-if="org.fullAddress">{{org.fullAddress}}</p>
        <p class="school-address" ng-if="org.Mobile">PHONE: {{org.Mobile}}</p>
      </div>

      <div class="staff-photo-area">
        <img ng-src="{{userInfo.Image}}" alt="Staff Photo">
      </div>

      <div class="staff-name">{{userInfo.Name}}</div>

      <div class="designation" ng-if="showStaffField('Designation', userInfo)">{{userInfo.Designation}}</div>

      <div class="staff-info">
        <div class="info-row" ng-if="showStaffField('DateOfBirth', userInfo)">
          <div class="info-label">D.O.B</div>
          <div class="info-devider">:</div>
          <div class="info-value">{{userInfo.DateOfBirth | date:'dd MMM yyyy'}}</div>
        </div>
        <div class="info-row" ng-if="showStaffField('Mobile', userInfo)">
          <div class="info-label">Mobile</div>
          <div class="info-devider">:</div>
          <div class="info-value">{{userInfo.Mobile}}</div>
        </div>
        <div class="info-row" ng-if="showStaffField('Address', userInfo)">
          <div class="info-label">Address</div>
          <div class="info-devider">:</div>
          <div class="info-value">{{userInfo.Address}}</div>
        </div>
      </div>

      <div class="principal-signature-area" ng-if="!hideSignature">
        <div class="principal-sign" ng-if="org.Sign">
          <img ng-src="{{org.Sign}}" alt="Signature">
        </div>
        <div class="principal-label">{{principalLabel}}</div>
      </div>
    </div>
  </script>

  <script>
    var app = angular.module("myApp", []);
    var baseApiUrl = "https://api.schoolvertex.com/api";
    var designBaseUrl = "https://cdn.jsdelivr.net/gh/gitcdnsv/svcdn/IdCardBg/";
    var settingsUrl = "https://schoolvertex.github.io/Pages/IdCards/Staff/staff-settings.json";

    app.controller("myCtrl", function ($scope, $http) {
      $scope.userList = [];
      $scope.org = {};
      $scope.bgStyle = {
        "background-image": "url('" + designBaseUrl + "102.jpg')"
      };
      $scope.principalLabel = "Principal Signature";
      $scope.hideSignature = false;
      $scope.useTwoLineSchoolName = false;
      $scope.schoolNameLine1 = "";
      $scope.schoolNameLine2 = "";
      $scope.schoolNameLine1FontSize = 13;
      $scope.schoolNameLine1FontFamily = "Arial, Helvetica, sans-serif";
      $scope.schoolNameLine2FontSize = 11;
      $scope.schoolNameLine2FontFamily = "Arial, Helvetica, sans-serif";
      $scope.staffFields = ["Designation", "DateOfBirth", "Mobile", "Address"];
      $scope.schoolInfoOverrides = {};

      var designMap = {};
      for (var i = 1; i <= 102; i++) {
        designMap[i] = designBaseUrl + i + ".jpg";
      }

      function setCssVar(name, value) {
        document.documentElement.style.setProperty(name, value);
      }

      function resolveColorName(name, fallback) {
        var n = String(name || "").trim();
        return n || fallback || "Black";
      }

      function normalizePhotoObjectFit(v) {
        return String(v || "cover").toLowerCase() === "fill" ? "fill" : "cover";
      }

      function normalizeBackgroundOpacity(v) {
        var n = parseFloat(v);
        if (isNaN(n)) return 1;
        return Math.max(0, Math.min(1, n));
      }

      function hasNonEmptyValue(value) {
        if (value === undefined || value === null) return false;
        if (typeof value === "string") return value.trim() !== "";
        return true;
      }

      function isStaffFieldEnabled(fieldKey) {
        return ($scope.staffFields || []).indexOf(fieldKey) !== -1;
      }

      $scope.showStaffField = function (fieldKey, user) {
        if (!isStaffFieldEnabled(fieldKey)) return false;
        if (!user) return false;
        switch (fieldKey) {
          case "Designation":
            return hasNonEmptyValue(user.Designation);
          case "DateOfBirth":
            return hasNonEmptyValue(user.DateOfBirth);
          case "Mobile":
            return hasNonEmptyValue(user.Mobile);
          case "Address":
            return hasNonEmptyValue(user.Address);
          default:
            return hasNonEmptyValue(user[fieldKey]);
        }
      };

      function splitSchoolName(name) {
        var text = String(name || "").trim();
        if (!text) {
          $scope.schoolNameLine1 = "";
          $scope.schoolNameLine2 = "";
          return;
        }
        var parts = text.split(/\s+/);
        if (parts.length <= 2) {
          $scope.schoolNameLine1 = text;
          $scope.schoolNameLine2 = "";
          return;
        }
        var mid = Math.ceil(parts.length / 2);
        $scope.schoolNameLine1 = parts.slice(0, mid).join(" ");
        $scope.schoolNameLine2 = parts.slice(mid).join(" ");
      }

      function applySchoolNameLineStyles() {
        setCssVar("--school-name-line1-font-size", ($scope.schoolNameLine1FontSize || 13) + "px");
        setCssVar("--school-name-line1-font-family", $scope.schoolNameLine1FontFamily || "Arial, Helvetica, sans-serif");
        setCssVar("--school-name-line2-font-size", ($scope.schoolNameLine2FontSize || 11) + "px");
        setCssVar("--school-name-line2-font-family", $scope.schoolNameLine2FontFamily || "Arial, Helvetica, sans-serif");
      }

      function applySchoolInfoOverrides() {
        if (!$scope.org) return;
        var o = $scope.schoolInfoOverrides || {};
        if (o.Description !== undefined && o.Description !== null) {
          $scope.org.Description = o.Description;
        }
        if (o.AffiliationInfo !== undefined && o.AffiliationInfo !== null) {
          $scope.org.AffiliationInfo = o.AffiliationInfo;
        }
        if (o.FullAddress !== undefined && o.FullAddress !== null) {
          $scope.org.fullAddress = o.FullAddress;
          $scope.org.FullAddress = o.FullAddress;
        }
        if (o.Mobile !== undefined && o.Mobile !== null) {
          $scope.org.Mobile = o.Mobile;
        }
      }

      function applyDesignConfig(config) {
        if (!config) return;

        if (config.BackgroundImage && designMap[config.BackgroundImage]) {
          $scope.bgStyle = {
            "background-image": "url('" + designMap[config.BackgroundImage] + "')"
          };
        }

        if (config.BackgroundOpacity !== undefined && config.BackgroundOpacity !== null && config.BackgroundOpacity !== "") {
          setCssVar("--bg-image-opacity", String(normalizeBackgroundOpacity(config.BackgroundOpacity)));
        } else {
          setCssVar("--bg-image-opacity", "1");
        }

        if (config.PrimaryColor) {
          setCssVar("--school-color", resolveColorName(config.PrimaryColor, "Purple"));
        }
        if (config.TextColor) {
          setCssVar("--text-color", resolveColorName(config.TextColor, "Black"));
        }

        if (config.SchoolNameSize !== undefined && config.SchoolNameSize !== null && config.SchoolNameSize !== "") {
          var size = String(config.SchoolNameSize).replace(/px$/i, "");
          setCssVar("--school-name-font-size", size + "px");
        }

        if (config.PhotoHeight !== undefined && config.PhotoHeight !== null) {
          setCssVar("--staff-photo-height", config.PhotoHeight + "px");
        }
        if (config.PhotoBorderRadius !== undefined && config.PhotoBorderRadius !== null) {
          setCssVar("--staff-photo-border-radius", config.PhotoBorderRadius + "%");
        }
        if (config.PhotoObjectFit || config.PhotoFit) {
          setCssVar("--staff-photo-object-fit", normalizePhotoObjectFit(config.PhotoObjectFit || config.PhotoFit));
        } else {
          setCssVar("--staff-photo-object-fit", "cover");
        }

        if (config.PrincipalSignature || config.PrincipalLabel) {
          $scope.principalLabel = config.PrincipalSignature || config.PrincipalLabel;
        } else {
          $scope.principalLabel = "Principal Signature";
        }
        if (config.PrincipalSignHeight !== undefined && config.PrincipalSignHeight !== null) {
          setCssVar("--principal-sign-height", config.PrincipalSignHeight + "px");
        }
        $scope.hideSignature = config.HideSignature === true || config.HideSignature === 1 || config.HideSignature === "true";

        if (Array.isArray(config.StaffFields)) {
          $scope.staffFields = config.StaffFields.map(String);
        } else if (typeof config.StaffFields === "string" && config.StaffFields.trim()) {
          $scope.staffFields = config.StaffFields.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        }

        $scope.schoolInfoOverrides = {};
        if (config.SchoolDescription !== undefined) $scope.schoolInfoOverrides.Description = config.SchoolDescription;
        if (config.SchoolAffiliationInfo !== undefined) $scope.schoolInfoOverrides.AffiliationInfo = config.SchoolAffiliationInfo;
        if (config.SchoolFullAddress !== undefined) $scope.schoolInfoOverrides.FullAddress = config.SchoolFullAddress;
        if (config.SchoolMobile !== undefined) $scope.schoolInfoOverrides.Mobile = config.SchoolMobile;
        applySchoolInfoOverrides();

        var twoLineOn = config.SchoolNameTwoLine === true || config.SchoolNameTwoLine === 1 || config.SchoolNameTwoLine === "true";
        $scope.useTwoLineSchoolName = !!twoLineOn;
        if (twoLineOn) {
          if (config.SchoolNameLine1) $scope.schoolNameLine1 = config.SchoolNameLine1;
          if (config.SchoolNameLine2 !== undefined && config.SchoolNameLine2 !== null) {
            $scope.schoolNameLine2 = config.SchoolNameLine2;
          }
          if (config.SchoolNameLine1FontSize != null) {
            $scope.schoolNameLine1FontSize = parseInt(config.SchoolNameLine1FontSize, 10) || 13;
          }
          if (config.SchoolNameLine1FontFamily) {
            $scope.schoolNameLine1FontFamily = config.SchoolNameLine1FontFamily;
          }
          if (config.SchoolNameLine2FontSize != null) {
            $scope.schoolNameLine2FontSize = parseInt(config.SchoolNameLine2FontSize, 10) || 11;
          }
          if (config.SchoolNameLine2FontFamily) {
            $scope.schoolNameLine2FontFamily = config.SchoolNameLine2FontFamily;
          }
          if (!$scope.schoolNameLine1 && $scope.org && $scope.org.Name) {
            splitSchoolName($scope.org.Name);
          }
          applySchoolNameLineStyles();
        }
      }

      // Defaults
      setCssVar("--school-color", "Purple");
      setCssVar("--text-color", "Black");
      setCssVar("--school-name-font-size", "13px");
      setCssVar("--staff-photo-height", "100px");
      setCssVar("--staff-photo-border-radius", "50%");
      setCssVar("--staff-photo-object-fit", "cover");
      setCssVar("--principal-sign-height", "20px");
      setCssVar("--bg-image-opacity", "1");

      function getQueryParams() {
        var params = {};
        location.search
          .substr(1)
          .split("&")
          .forEach(function (item) {
            var parts = item.split("=");
            if (parts[0]) params[parts[0]] = decodeURIComponent(parts[1] || "");
          });
        return params;
      }

      var query = getQueryParams();
      var userId = query.userId;
      var classId = parseInt(query.classId || 0);
      var sectionId = parseInt(query.sectionId || 0);
      var orgId = query.orgId;

      $http.get(baseApiUrl + "/Organisation/GetInfoForCertificate/" + orgId).then(function (response) {
        var data = response.data;
        if (data) {
          $scope.org = data;
          if (data.FullAddress) {
            $scope.org.fullAddress = data.FullAddress;
          } else if (data.AddressInfo) {
            var a = data.AddressInfo;
            var parts = [a.Plot_HouseNumber, a.LandMark, a.Street, a.City, a.State, a.ZipCode].filter(Boolean);
            $scope.org.fullAddress = parts.join(", ");
          }
          if ($scope.useTwoLineSchoolName) {
            if (!$scope.schoolNameLine1) splitSchoolName(data.Name);
          } else {
            splitSchoolName(data.Name);
          }
          applySchoolInfoOverrides();
        }
      }, function (error) {
        console.error("Organisation API failed:", error.status, error.statusText);
      });

      $http.get(settingsUrl).then(function (response) {
        var data = response.data || {};
        var key = orgId != null ? String(orgId) : "All";
        var config = data[key] || data["All"] || {};
        applyDesignConfig(config);
      }, function (error) {
        console.error("Staff design config failed — using defaults:", error.status, error.statusText);
      });

      if (userId) {
        $http.get(baseApiUrl + "/Fee/GetStaffIdCardInfo/" + orgId + "/" + userId).then(function (response) {
          $scope.userInfo = response.data;
        });
      } else if (sectionId > 0 || classId > 0) {
        var bulkUrl = null;
        if (sectionId > 0) {
          bulkUrl = baseApiUrl + "/Fee/GetStaffSectionIdCardInfo/" + sectionId;
        } else if (classId > 0) {
          bulkUrl = baseApiUrl + "/Fee/GetStaffBatchIdCardInfo/" + classId;
        }
        if (bulkUrl) {
          $http.get(bulkUrl).then(function (response) {
            $scope.userList = response.data || [];
          });
        }
      }
    });
  </script>
</body>

</html>
