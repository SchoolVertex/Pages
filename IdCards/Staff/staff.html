<!DOCTYPE html>
<html lang="en" ng-app="myApp">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff ID Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --school-color: #9C27B0;
      --text-color: black;
      --school-name-font-size: 13px;
      --staff-photo-height: 100px;
      --staff-photo-border-radius: 50%;
      --school-logo-border-radius: 50%;
      --staff-photo-object-fit: cover;
      --principal-sign-height: 20px;
      --bg-image-opacity: 1;
      --school-name-line1-font-size: 13px;
      --school-name-line1-font-family: Arial, Helvetica, sans-serif;
      --school-name-line2-font-size: 11px;
      --school-name-line2-font-family: Arial, Helvetica, sans-serif;
      /* Exact PVC print size (printer: 57.2×91.5mm) · Text Part: 50×82mm · text safe inset: 6mm */
      --id-card-width: 57.2mm;
      --id-card-height: 91.5mm;
      --id-text-part-width: 50mm;
      --id-text-part-height: 82mm;
      --id-safe-inset: 6mm;
      /* (91.5 - 82) / 2 = 4.75mm · (57.2 - 50) / 2 = 3.6mm · pad so text is 6mm from edge */
      --id-text-part-margin-y: 4.75mm;
      --id-text-part-padding-y: 1.25mm;
      --id-text-part-padding-x: 2.4mm;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #e9eef2;
      margin: 0;
      padding: 0;
      display: block !important;
    }

    .control-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 20px;
      align-items: center;
      background: #fff;
      padding: 10px 14px;
      border-bottom: 1px solid #ccc;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .control-bar .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-bar .control-group label {
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .control-bar input[type="checkbox"] {
      margin: 0;
      vertical-align: middle;
    }

    .control-bar .print-btn {
      font-size: 14px;
      font-weight: 600;
      padding: 6px 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
    }

    .control-bar .print-btn:hover {
      background: #ebebeb;
    }

    .control-bar .control-hint {
      font-size: 13px;
      font-weight: 600;
      color: #c02026;
    }

    .school-name-two-line {
      display: block;
      line-height: 1.15;
      font-weight: 700;
      color: var(--school-color);
    }

    .school-name-two-line .school-name-line1 {
      display: block;
      font-family: var(--school-name-line1-font-family, Arial, Helvetica, sans-serif);
      font-size: var(--school-name-line1-font-size, 13px);
    }

    .school-name-two-line .school-name-line2 {
      display: block;
      font-family: var(--school-name-line2-font-family, Arial, Helvetica, sans-serif);
      font-size: var(--school-name-line2-font-size, 11px);
    }

    .id-card {
      width: var(--id-card-width);
      height: var(--id-card-height);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      background: #fff;
      margin: 0 auto;
      page-break-after: always;
      break-after: page;
      box-sizing: border-box;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: var(--bg-image-opacity, 1);
      z-index: 0;
    }

    /* Text Part 50×82mm centered in card; inner padding keeps text 6mm from outer edges */
    .main-content {
      width: var(--id-text-part-width);
      height: var(--id-text-part-height);
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: var(--id-text-part-margin-y) auto;
      padding: var(--id-text-part-padding-y) var(--id-text-part-padding-x);
      border-radius: 10px;
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* View-only print-area guide — outline does not change the box model */
    .show-print-area .main-content {
      outline: 1px solid red;
      outline-offset: -1px;
    }

    .school-info {
      display: flex;
      align-items: center;
      gap: 2px;
      width: 100%;
      color: #2c3e50;
      border-bottom: 1px solid var(--school-color);
      text-align: center;
    }

    .school-logo {
      height: 47px;
    }

    .school-logo img {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: var(--school-logo-border-radius, 50%);
      object-fit: cover;
    }

    .school-name {
      font-size: var(--school-name-font-size, 13px);
      font-weight: 700;
      flex: 1;
      min-width: 0;
    }

    .school-color {
      color: var(--school-color);
    }

    .school-name-dynamic {
      font-size: var(--school-name-font-size, 13px);
      color: var(--school-color);
    }

    /* Description — distinct caption style (not the same as AffiliationInfo) */
    .school-name > .school-caption,
    .school-caption {
      font-size: 6px;
      font-weight: 600;
      font-style: italic;
      line-height: 1.25;
      display: block;
      margin: 1px 0 0;
      color: var(--text-color);
    }

    .school-affliate {
      font-size: 6px;
      font-weight: 600;
      font-style: italic;
      color: var(--text-color);
    }

    .school-address {
      font-size: 5px;
      font-weight: bold;
      font-style: normal;
      color: var(--text-color);
    }

    .text-color {
      color: var(--text-color);
    }

    .staff-photo-area {
      width: var(--staff-photo-height);
      height: var(--staff-photo-height);
      border-radius: var(--staff-photo-border-radius);
      border: 3px solid #fff;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      flex-shrink: 0;
      overflow: hidden;
      margin-top: 5px;
    }

    .staff-photo-area img {
      width: 100%;
      height: 100%;
      object-fit: var(--staff-photo-object-fit, cover);
      display: block;
    }

    .staff-name {
      margin-top: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--school-color);
      text-align: center;
      width: 95%;
      line-height: 1.2;
    }

    .designation {
      font-size: 12px;
      font-weight: 600;
      color: #FF5722;
      text-align: center;
      margin-top: 2px;
    }

    .staff-info {
      text-align: left;
      padding: 5px;
      width: 90%;
    }

    .info-row {
      display: flex;
      margin-bottom: 5px;
      font-size: 8px;
      color: #000;
      font-weight: 600;
    }

    .info-label {
      font-weight: 600;
      width: 48px;
      color: var(--school-color);
      flex-shrink: 0;
    }

    .info-devider {
      margin-right: 3px;
    }

    .info-value {
      color: var(--text-color);
      word-break: break-word;
    }

    .principal-signature-area {
      color: #000;
      text-align: center;
      margin-top: auto;
      padding-bottom: 4px;
      flex-shrink: 0;
    }

    .principal-sign {
      margin: -6px;
      min-height: 12px;
    }

    .principal-sign img {
      height: var(--principal-sign-height);
      max-width: 90px;
      object-fit: contain;
    }

    .principal-label {
      font-size: 8px;
      letter-spacing: 0.5px;
      border-top: 1px solid #000;
      color: var(--text-color);
    }

    @media print {
      html,
      body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 57.2mm !important;
        min-height: 91.5mm;
        height: auto !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .control-bar {
        display: none !important;
      }

      .id-card {
        width: 57.2mm !important;
        height: 91.5mm !important;
        min-width: 57.2mm !important;
        min-height: 91.5mm !important;
        max-width: 57.2mm !important;
        max-height: 91.5mm !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid;
        break-inside: avoid;
        transform: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .bg-image {
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background-size: cover !important;
        background-position: center !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .main-content {
        width: var(--id-text-part-width);
        height: var(--id-text-part-height);
        margin: var(--id-text-part-margin-y) auto;
        padding: var(--id-text-part-padding-y) var(--id-text-part-padding-x);
        box-sizing: border-box;
        outline: none !important;
      }
    }

    @page {
      size: 57.2mm 91.5mm;
      margin: 0;
    }
  </style>
</head>

<body ng-controller="myCtrl" id="page-body" ng-class="{'show-print-area': showPrintArea}">

  <div class="control-bar" ng-cloak>
    <div class="control-group">
      <label>
        <input type="checkbox" ng-model="hideCardsWithoutPhotos" ng-change="applyCardFilters()" />
        Hide cards without photos
      </label>
    </div>
    <div class="control-group">
      <label>
        <input type="checkbox" ng-model="showOnlyTrimmedCards" ng-change="applyCardFilters()" />
        Show only trimmed cards
      </label>
    </div>
    <div class="control-group">
      <label>
        <input type="checkbox" ng-model="showPrintArea" />
        Show print area
      </label>
    </div>
    <div class="control-group" ng-if="trimmedCardsCount !== null">
      <span class="control-hint">{{trimmedCardsCount}} trimmed</span>
    </div>
    <div class="control-group">
      <button type="button" class="print-btn" ng-click="printCards()">Print</button>
    </div>
  </div>

  <!-- Single Card -->
  <div class="id-card" ng-if="userInfo && !userList.length">
    <div ng-include="'id-card-template.html'"></div>
  </div>

  <!-- Bulk Cards -->
  <div class="id-card" ng-repeat="userInfo in userList">
    <div ng-include="'id-card-template.html'"></div>
  </div>

  <!-- Shared Card Template -->
  <script type="text/ng-template" id="id-card-template.html">
    <div class="bg-image" ng-style="bgStyle"></div>

    <div class="main-content">
      <div class="school-info">
        <div class="school-logo">
          <img ng-src="{{org.Image}}" alt="School Logo">
        </div>
        <div class="school-name">
          <span class="school-color school-name-two-line" ng-if="useTwoLineSchoolName">
            <span class="school-name-line1">{{schoolNameLine1}}</span>
            <span class="school-name-line2" ng-if="schoolNameLine2">{{schoolNameLine2}}</span>
          </span>
          <span class="school-color school-name-dynamic" ng-if="!useTwoLineSchoolName">{{org.Name}}</span>
          <p class="school-caption text-color" ng-if="org.Description">{{org.Description}}</p>
          <p class="school-affliate text-color" ng-if="org.AffiliationInfo || org.Affiliation">{{org.AffiliationInfo || org.Affiliation}}</p>
          <p class="school-address text-color" ng-if="org.FullAddress || org.fullAddress">{{org.FullAddress || org.fullAddress}}</p>
          <p class="school-address text-color" ng-if="org.Mobile">{{org.Mobile}}</p>
        </div>
      </div>

      <div class="staff-photo-area">
        <img ng-src="{{userInfo.Image}}" alt="Staff Photo">
      </div>

      <div class="staff-name">{{userInfo.Name}}</div>

      <div class="designation" ng-if="showStaffField('Designation', userInfo)">{{userInfo.Designation}}</div>

      <div class="staff-info">
        <div class="info-row"
             ng-repeat="fieldKey in staffFields"
             ng-if="fieldKey !== 'Designation' && showStaffField(fieldKey, userInfo)">
          <div class="info-label">{{staffFieldLabel(fieldKey)}}</div>
          <div class="info-devider">:</div>
          <div class="info-value" ng-switch="fieldKey">
            <span ng-switch-when="DateOfBirth">{{userInfo.DateOfBirth | date:'dd MMM yyyy'}}</span>
            <span ng-switch-default>{{userInfo[fieldKey]}}</span>
          </div>
        </div>
      </div>

      <div class="principal-signature-area" ng-if="!hideSignature">
        <div class="principal-sign">
          <img ng-if="org.Sign" ng-src="{{org.Sign}}" alt="Signature">
        </div>
        <div class="principal-label">{{principalLabel}}</div>
      </div>
    </div>
  </script>

  <script>
    (function (global) {
      var PLACEHOLDER_SNIPPETS = [
        "user avatar", "user-avatar", "user_avatar", "useravatar",
        "default photo", "default-photo", "default_photo", "defaultphoto",
        "default image", "default-image", "default_image", "defaultimage",
        "no-image", "no_image", "noimage", "placeholder",
        "avatar.png", "avatar.jpg", "blank-avatar", "blank_avatar"
      ];

      function normalizeImageValue(imageUrl) {
        if (imageUrl == null) return "";
        return String(imageUrl).trim().toLowerCase();
      }

      function isMissingOrPlaceholderPhoto(imageUrl) {
        var value = normalizeImageValue(imageUrl);
        if (!value) return true;
        for (var i = 0; i < PLACEHOLDER_SNIPPETS.length; i++) {
          if (value.indexOf(PLACEHOLDER_SNIPPETS[i]) !== -1) return true;
        }
        return false;
      }

      function userHasRealPhoto(user) {
        if (!user) return false;
        return !isMissingOrPlaceholderPhoto(user.Image);
      }

      function filterUsersWithPhotos(users) {
        var list = Array.isArray(users) ? users : [];
        var kept = [];
        for (var i = 0; i < list.length; i++) {
          if (userHasRealPhoto(list[i])) kept.push(list[i]);
        }
        return kept;
      }

      global.IdCardNoPhotoHelper = {
        isMissingOrPlaceholderPhoto: isMissingOrPlaceholderPhoto,
        userHasRealPhoto: userHasRealPhoto,
        filterUsersWithPhotos: filterUsersWithPhotos
      };
    })(window);
  </script>

  <script>
    var app = angular.module("myApp", []);
    var baseApiUrl = "https://api.schoolvertex.com/api";
    var designBaseUrl = "https://cdn.jsdelivr.net/gh/gitcdnsv/svcdn/IdCardBg/";
    var settingsUrl = "https://schoolvertex.github.io/Pages/IdCards/Staff/staff-settings.json";

    app.controller("myCtrl", function ($scope, $http, $timeout) {
      $scope.userList = [];
      $scope.org = {};
      $scope.bgStyle = {
        "background-image": "url('" + designBaseUrl + "1.jpg')"
      };
      $scope.principalLabel = "Principal Signature";
      $scope.hideSignature = false;
      $scope.useTwoLineSchoolName = false;
      $scope.schoolNameLine1 = "";
      $scope.schoolNameLine2 = "";
      $scope.schoolNameLine1FontSize = 13;
      $scope.schoolNameLine1FontFamily = "Arial, Helvetica, sans-serif";
      $scope.schoolNameLine2FontSize = 11;
      $scope.schoolNameLine2FontFamily = "Arial, Helvetica, sans-serif";
      $scope.staffFields = ["Designation", "DateOfBirth", "Mobile", "Address"];
      $scope.schoolInfoOverrides = {};
      $scope.hideCardsWithoutPhotos = false;
      $scope.showOnlyTrimmedCards = false;
      $scope.showPrintArea = false;
      $scope.trimmedCardsCount = null;
      $scope._allUserList = [];
      $scope._allUserInfo = null;
      $scope._trimScanToken = 0;
      var DEFAULT_STAFF_FIELDS = ["Designation", "DateOfBirth", "Mobile", "Address"];
      var commonColors = [
        "Black","White","Gray","Silver","Red","Maroon","Yellow","Olive","Lime","Green",
        "Aqua","Teal","Blue","Navy","Fuchsia","Purple","AliceBlue","AntiqueWhite",
        "Aquamarine","Azure","Beige","Bisque","BlueViolet","Brown","BurlyWood","CadetBlue",
        "Chartreuse","Chocolate","Coral","CornflowerBlue","Crimson","Cyan","DarkBlue",
        "DarkCyan","DarkGoldenRod","DarkGray","DarkGreen","DarkMagenta","DarkOrange",
        "DarkOrchid","DarkRed","DarkSalmon","DarkSeaGreen","DarkSlateBlue","DarkViolet",
        "DeepPink","DeepSkyBlue","DodgerBlue","FireBrick","ForestGreen","Gold","GoldenRod",
        "GreenYellow","HotPink","IndianRed","Indigo","Khaki","Lavender","LightBlue",
        "LightCoral","LightCyan","LightGray","LightGreen","LightPink","LightSalmon",
        "LightSeaGreen","LightSkyBlue","LightSteelBlue","LimeGreen","Magenta","MediumBlue",
        "MediumOrchid","MediumPurple","MediumSeaGreen","MediumSlateBlue","MediumSpringGreen",
        "MediumTurquoise","MediumVioletRed","MidnightBlue","Orange","OrangeRed","Orchid",
        "PaleGreen","PaleTurquoise","PaleVioletRed","Peru","Pink","Plum","PowderBlue",
        "RosyBrown","RoyalBlue","SaddleBrown","Salmon","SandyBrown","SeaGreen","Sienna",
        "SkyBlue","SlateBlue","SpringGreen","SteelBlue","Tan","Thistle","Tomato","Turquoise",
        "Violet","Wheat","YellowGreen"
      ];

      var designMap = {};
      for (var i = 1; i <= 102; i++) {
        designMap[i] = designBaseUrl + i + ".jpg";
      }

      function setCssVar(name, value) {
        document.documentElement.style.setProperty(name, value);
      }

      function resolveColorName(value, fallback) {
        if (!value) return fallback || "Black";
        var needle = String(value).toLowerCase().trim();
        for (var i = 0; i < commonColors.length; i++) {
          if (commonColors[i].toLowerCase() === needle) return commonColors[i];
        }
        return String(value).trim() || fallback || "Black";
      }

      function normalizePhotoObjectFit(v) {
        return String(v || "cover").toLowerCase() === "fill" ? "fill" : "cover";
      }

      function normalizeBackgroundOpacity(v) {
        var n = parseFloat(v);
        if (isNaN(n)) return 1;
        return Math.max(0, Math.min(1, n));
      }

      function hasNonEmptyValue(value) {
        if (value === undefined || value === null) return false;
        if (typeof value === "string") return value.trim() !== "";
        return true;
      }

      function isStaffFieldEnabled(fieldKey) {
        return ($scope.staffFields || []).indexOf(fieldKey) !== -1;
      }

      $scope.showStaffField = function (fieldKey, user) {
        if (!isStaffFieldEnabled(fieldKey)) return false;
        if (!user) return false;
        switch (fieldKey) {
          case "Designation":
            return hasNonEmptyValue(user.Designation);
          case "DateOfBirth":
            return hasNonEmptyValue(user.DateOfBirth);
          case "Mobile":
            return hasNonEmptyValue(user.Mobile);
          case "Address":
            return hasNonEmptyValue(user.Address);
          default:
            return hasNonEmptyValue(user[fieldKey]);
        }
      };

      $scope.staffFieldLabel = function (key) {
        var map = { DateOfBirth: "D.O.B", Mobile: "Mobile", Address: "Address" };
        return map[key] || key;
      };

      $scope.printCards = function () {
        window.print();
      };

      function getPhotoFilteredList() {
        var helper = window.IdCardNoPhotoHelper;
        var list = Array.isArray($scope._allUserList) ? $scope._allUserList : [];
        if ($scope.hideCardsWithoutPhotos && helper) {
          return helper.filterUsersWithPhotos(list);
        }
        return list.slice();
      }

      function getPhotoFilteredSingle() {
        var helper = window.IdCardNoPhotoHelper;
        var user = $scope._allUserInfo;
        if (!user) return null;
        if ($scope.hideCardsWithoutPhotos && helper && !helper.userHasRealPhoto(user)) {
          return null;
        }
        return user;
      }

      function cardContentOverflows(cardEl) {
        if (!cardEl) return false;
        var main = cardEl.querySelector(".main-content");
        if (!main) return false;
        var tol = 1.5;
        if (main.scrollHeight > main.clientHeight + tol) return true;
        if (main.scrollWidth > main.clientWidth + tol) return true;

        var mainRect = main.getBoundingClientRect();
        var nodes = main.querySelectorAll("*");
        for (var i = 0; i < nodes.length; i++) {
          var el = nodes[i];
          var style = window.getComputedStyle(el);
          if (style.display === "none" || style.visibility === "hidden") continue;
          var r = el.getBoundingClientRect();
          if (r.width < 0.5 && r.height < 0.5) continue;
          if (
            r.bottom > mainRect.bottom + tol ||
            r.right > mainRect.right + tol ||
            r.top < mainRect.top - tol ||
            r.left < mainRect.left - tol
          ) {
            return true;
          }
        }
        return false;
      }

      function collectOverflowingUsers(baseList) {
        var cards = document.querySelectorAll(".id-card");
        var trimmed = [];
        var limit = Math.min(cards.length, baseList.length);
        for (var i = 0; i < limit; i++) {
          if (cardContentOverflows(cards[i])) {
            trimmed.push(baseList[i]);
          }
        }
        return trimmed;
      }

      function afterCardsPainted(callback) {
        $timeout(function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              $timeout(callback, 250);
            });
          });
        }, 0);
      }

      function applyTrimmedFilterFromDom(baseList, token) {
        if (token !== $scope._trimScanToken) return;
        if (!$scope.showOnlyTrimmedCards) return;

        var trimmed = collectOverflowingUsers(baseList);
        $scope.$applyAsync(function () {
          if (token !== $scope._trimScanToken) return;
          $scope.trimmedCardsCount = trimmed.length;
          $scope.userList = trimmed;
          $scope.userInfo = null;
        });
      }

      function applyTrimmedFilterSingleFromDom(user, token) {
        if (token !== $scope._trimScanToken) return;
        if (!$scope.showOnlyTrimmedCards) return;

        var card = document.querySelector(".id-card");
        var overflows = cardContentOverflows(card);
        $scope.$applyAsync(function () {
          if (token !== $scope._trimScanToken) return;
          $scope.trimmedCardsCount = overflows ? 1 : 0;
          $scope.userInfo = overflows ? user : null;
          $scope.userList = [];
        });
      }

      $scope.applyCardFilters = function () {
        var token = ++$scope._trimScanToken;

        if ($scope._allUserList && $scope._allUserList.length) {
          var base = getPhotoFilteredList();
          $scope.userInfo = null;

          if (!$scope.showOnlyTrimmedCards) {
            $scope.trimmedCardsCount = null;
            $scope.userList = base;
            return;
          }

          $scope.userList = base;
          afterCardsPainted(function () {
            applyTrimmedFilterFromDom(base, token);
          });
          return;
        }

        var single = getPhotoFilteredSingle();
        $scope.userList = [];

        if (!$scope.showOnlyTrimmedCards) {
          $scope.trimmedCardsCount = null;
          $scope.userInfo = single;
          return;
        }

        if (!single) {
          $scope.trimmedCardsCount = 0;
          $scope.userInfo = null;
          return;
        }

        $scope.userInfo = single;
        afterCardsPainted(function () {
          applyTrimmedFilterSingleFromDom(single, token);
        });
      };

      function offerHideCardsWithoutPhotos(usersOrUser, isBulk) {
        if (isBulk) {
          $scope._allUserList = Array.isArray(usersOrUser) ? usersOrUser.slice() : [];
          $scope._allUserInfo = null;
        } else {
          $scope._allUserInfo = usersOrUser || null;
          $scope._allUserList = [];
        }
        $scope.applyCardFilters();
      }

      function splitSchoolName(name) {
        var text = String(name || "").trim();
        if (!text) {
          $scope.schoolNameLine1 = "";
          $scope.schoolNameLine2 = "";
          return;
        }
        var match = text.match(/^(.*?)\s+(International\s+School.*)$/i);
        if (match) {
          $scope.schoolNameLine1 = match[1];
          $scope.schoolNameLine2 = match[2];
          return;
        }
        var parts = text.split(/\s+/);
        if (parts.length > 2) {
          $scope.schoolNameLine1 = parts.slice(0, 2).join(" ");
          $scope.schoolNameLine2 = parts.slice(2).join(" ");
          return;
        }
        $scope.schoolNameLine1 = text;
        $scope.schoolNameLine2 = "";
      }

      function applySchoolNameLineStyles() {
        setCssVar("--school-name-line1-font-size", ($scope.schoolNameLine1FontSize || 13) + "px");
        setCssVar("--school-name-line1-font-family", $scope.schoolNameLine1FontFamily || "Arial, Helvetica, sans-serif");
        setCssVar("--school-name-line2-font-size", ($scope.schoolNameLine2FontSize || 11) + "px");
        setCssVar("--school-name-line2-font-family", $scope.schoolNameLine2FontFamily || "Arial, Helvetica, sans-serif");
      }

      function applySchoolInfoOverrides() {
        if (!$scope.org) return;
        var o = $scope.schoolInfoOverrides || {};
        if (o.Description !== undefined && o.Description !== null) {
          $scope.org.Description = o.Description;
        }
        if (o.AffiliationInfo !== undefined && o.AffiliationInfo !== null) {
          $scope.org.AffiliationInfo = o.AffiliationInfo;
        }
        if (o.FullAddress !== undefined && o.FullAddress !== null) {
          $scope.org.fullAddress = o.FullAddress;
          $scope.org.FullAddress = o.FullAddress;
        }
        if (o.Mobile !== undefined && o.Mobile !== null) {
          $scope.org.Mobile = o.Mobile;
        }
      }

      function applyDesignConfig(config) {
        if (!config) return;

        if (config.BackgroundImage && designMap[config.BackgroundImage]) {
          $scope.bgStyle = {
            "background-image": "url('" + designMap[config.BackgroundImage] + "')"
          };
        }

        if (config.BackgroundOpacity !== undefined && config.BackgroundOpacity !== null && config.BackgroundOpacity !== "") {
          setCssVar("--bg-image-opacity", String(normalizeBackgroundOpacity(config.BackgroundOpacity)));
        } else {
          setCssVar("--bg-image-opacity", "1");
        }

        if (config.PrimaryColor) {
          setCssVar("--school-color", resolveColorName(config.PrimaryColor, "Purple"));
        }
        if (config.TextColor) {
          setCssVar("--text-color", resolveColorName(config.TextColor, "Black"));
        }

        if (config.SchoolNameSize !== undefined && config.SchoolNameSize !== null && config.SchoolNameSize !== "") {
          var size = String(config.SchoolNameSize).replace(/px$/i, "");
          setCssVar("--school-name-font-size", size + "px");
        }

        if (config.PhotoHeight !== undefined && config.PhotoHeight !== null) {
          setCssVar("--staff-photo-height", config.PhotoHeight + "px");
        }
        if (config.PhotoBorderRadius !== undefined && config.PhotoBorderRadius !== null) {
          setCssVar("--staff-photo-border-radius", config.PhotoBorderRadius + "%");
        }
        if (config.SchoolLogoBorderRadius !== undefined && config.SchoolLogoBorderRadius !== null) {
          setCssVar("--school-logo-border-radius", config.SchoolLogoBorderRadius + "%");
        }
        if (config.PhotoObjectFit || config.PhotoFit) {
          setCssVar("--staff-photo-object-fit", normalizePhotoObjectFit(config.PhotoObjectFit || config.PhotoFit));
        } else {
          setCssVar("--staff-photo-object-fit", "cover");
        }

        if (config.PrincipalSignature || config.PrincipalLabel) {
          $scope.principalLabel = config.PrincipalSignature || config.PrincipalLabel;
        } else {
          $scope.principalLabel = "Principal Signature";
        }
        if (config.PrincipalSignHeight !== undefined && config.PrincipalSignHeight !== null) {
          setCssVar("--principal-sign-height", config.PrincipalSignHeight + "px");
        }
        $scope.hideSignature = config.HideSignature === true || config.HideSignature === 1 || config.HideSignature === "true";

        if (Array.isArray(config.StaffFields)) {
          $scope.staffFields = config.StaffFields.map(String);
          if (!$scope.staffFields.length) $scope.staffFields = DEFAULT_STAFF_FIELDS.slice();
        } else if (typeof config.StaffFields === "string" && config.StaffFields.trim()) {
          $scope.staffFields = config.StaffFields.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
          if (!$scope.staffFields.length) $scope.staffFields = DEFAULT_STAFF_FIELDS.slice();
        }

        $scope.schoolInfoOverrides = {};
        if (config.SchoolDescription !== undefined) $scope.schoolInfoOverrides.Description = config.SchoolDescription;
        if (config.SchoolAffiliationInfo !== undefined) $scope.schoolInfoOverrides.AffiliationInfo = config.SchoolAffiliationInfo;
        if (config.SchoolFullAddress !== undefined) $scope.schoolInfoOverrides.FullAddress = config.SchoolFullAddress;
        if (config.SchoolMobile !== undefined) $scope.schoolInfoOverrides.Mobile = config.SchoolMobile;
        applySchoolInfoOverrides();

        var twoLineOn = config.SchoolNameTwoLine === true || config.SchoolNameTwoLine === 1 || config.SchoolNameTwoLine === "true";
        $scope.useTwoLineSchoolName = !!twoLineOn;
        if (twoLineOn) {
          if (config.SchoolNameLine1 != null) $scope.schoolNameLine1 = config.SchoolNameLine1;
          if (config.SchoolNameLine2 !== undefined && config.SchoolNameLine2 !== null) {
            $scope.schoolNameLine2 = config.SchoolNameLine2;
          }
          if (config.SchoolNameLine1FontSize != null) {
            $scope.schoolNameLine1FontSize = parseInt(config.SchoolNameLine1FontSize, 10) || 13;
          }
          if (config.SchoolNameLine1FontFamily != null) {
            $scope.schoolNameLine1FontFamily = config.SchoolNameLine1FontFamily;
          }
          if (config.SchoolNameLine2FontSize != null) {
            $scope.schoolNameLine2FontSize = parseInt(config.SchoolNameLine2FontSize, 10) || 11;
          }
          if (config.SchoolNameLine2FontFamily != null) {
            $scope.schoolNameLine2FontFamily = config.SchoolNameLine2FontFamily;
          }
          if (!$scope.schoolNameLine1 && $scope.org && $scope.org.Name) {
            splitSchoolName($scope.org.Name);
          }
          applySchoolNameLineStyles();
        }
      }

      // Defaults
      setCssVar("--school-color", "Purple");
      setCssVar("--text-color", "Black");
      setCssVar("--school-name-font-size", "13px");
      setCssVar("--staff-photo-height", "100px");
      setCssVar("--staff-photo-border-radius", "50%");
      setCssVar("--school-logo-border-radius", "50%");
      setCssVar("--staff-photo-object-fit", "cover");
      setCssVar("--principal-sign-height", "20px");
      setCssVar("--bg-image-opacity", "1");

      function getQueryParams() {
        var params = {};
        location.search
          .substr(1)
          .split("&")
          .forEach(function (item) {
            var parts = item.split("=");
            if (parts[0]) params[parts[0]] = decodeURIComponent(parts[1] || "");
          });
        return params;
      }

      var query = getQueryParams();
      var userId = query.userId;
      var classId = parseInt(query.classId || 0);
      var sectionId = parseInt(query.sectionId || 0);
      var orgId = query.orgId || query.orgid;

      $http.get(baseApiUrl + "/Organisation/GetInfoForCertificate/" + orgId).then(function (response) {
        var data = response.data;
        if (data) {
          $scope.org = data;
          if (!data.AffiliationInfo && data.Affiliation) {
            $scope.org.AffiliationInfo = data.Affiliation;
          }
          if (data.FullAddress) {
            $scope.org.fullAddress = data.FullAddress;
            $scope.org.FullAddress = data.FullAddress;
          } else if (data.AddressInfo) {
            var a = data.AddressInfo;
            var parts = [a.Plot_HouseNumber, a.LandMark, a.Street, a.City, a.State, a.ZipCode].filter(Boolean);
            $scope.org.fullAddress = parts.join(", ");
            $scope.org.FullAddress = $scope.org.fullAddress;
          }
          if ($scope.useTwoLineSchoolName) {
            if (!$scope.schoolNameLine1) splitSchoolName(data.Name);
          } else {
            splitSchoolName(data.Name);
          }
          applySchoolInfoOverrides();
        }
      }, function (error) {
        console.error("Organisation API failed:", error.status, error.statusText);
      });

      $http.get(settingsUrl).then(function (response) {
        var data = response.data || {};
        var key = orgId != null ? String(orgId) : "All";
        var config = Object.assign({}, data["All"] || {}, data[key] || {});
        applyDesignConfig(config);
      }, function (error) {
        console.error("Staff design config failed — using defaults:", error.status, error.statusText);
      });

      if (userId) {
        $http.get(baseApiUrl + "/IdCard/GetStaffIdCardInfo/" + orgId + "/" + userId).then(function (response) {
          $scope.userInfo = response.data;
          offerHideCardsWithoutPhotos($scope.userInfo, false);
        });
      } else if (sectionId > 0 || classId > 0) {
        var bulkUrl = null;
        if (sectionId > 0) {
          bulkUrl = baseApiUrl + "/IdCard/GetStaffSectionIdCardInfo/" + sectionId;
        } else if (classId > 0) {
          bulkUrl = baseApiUrl + "/IdCard/GetStaffBatchIdCardInfo/" + classId;
        }
        if (bulkUrl) {
          $http.get(bulkUrl).then(function (response) {
            $scope.userList = response.data || [];
            offerHideCardsWithoutPhotos($scope.userList, true);
          });
        }
      }
    });
  </script>
</body>

</html>
