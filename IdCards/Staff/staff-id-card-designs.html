<!DOCTYPE html>
<html lang="en" ng-app="myApp">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff ID Card - Design Previews</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-sanitize.min.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --school-color: #9C27B0;
      --text-color: black;
      --school-name-font-size: 13px;
      --staff-photo-height: 100px;
      --staff-photo-border-radius: 50%;
      --staff-photo-object-fit: cover;
      --principal-sign-height: 20px;
      --bg-image-opacity: 1;
      --school-name-line1-font-size: 13px;
      --school-name-line1-font-family: Arial, Helvetica, sans-serif;
      --school-name-line2-font-size: 11px;
      --school-name-line2-font-family: Arial, Helvetica, sans-serif;
      /* Exact PVC print size (printer: 57.2×91.5mm) · Text Part: 50×82mm · text safe inset: 6mm */
      --id-card-width: 57.2mm;
      --id-card-height: 91.5mm;
      --id-text-part-width: 50mm;
      --id-text-part-height: 82mm;
      --id-safe-inset: 6mm;
      /* (91.5 - 82) / 2 = 4.75mm · (57.2 - 50) / 2 = 3.6mm · pad so text is 6mm from edge */
      --id-text-part-margin-y: 4.75mm;
      --id-text-part-padding-y: 1.25mm;
      --id-text-part-padding-x: 2.4mm;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #e9eef2;
      margin: 0;
      padding: 0;
      display: block !important;
    }

    .control-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 20px;
      align-items: center;
      background: #fff;
      padding: 10px 14px;
      border-bottom: 1px solid #ccc;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .control-group label {
      font-size: 14px;
      margin-right: 6px;
      font-weight: 600;
    }

    .control-group input[type="checkbox"] {
      margin-right: 6px;
      vertical-align: middle;
    }

    .color-select {
      position: relative;
      display: inline-block;
      min-width: 170px;
      vertical-align: middle;
    }

    .color-select-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 4px 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }

    .color-select-trigger:hover,
    .color-select.is-open .color-select-trigger {
      border-color: #888;
    }

    .color-swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .color-select-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .color-select-caret {
      color: #666;
      font-size: 11px;
      line-height: 1;
    }

    .color-select-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 260px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      z-index: 1200;
      padding: 4px;
    }

    .color-select.is-open .color-select-menu {
      display: block;
    }

    .color-select-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 8px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      border-radius: 3px;
      color: #222;
    }

    .color-select-option:hover,
    .color-select-option.is-selected {
      background: #f0f3f7;
    }

    .color-select-option.is-selected {
      font-weight: 600;
    }

    .control-panel-extra {
      display: none;
      width: 100%;
      flex-basis: 100%;
      gap: 16px 20px;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed #ddd;
      margin-top: 2px;
    }

    .control-panel-extra.is-open {
      display: flex;
    }

    .multi-select {
      position: relative;
      display: inline-block;
      min-width: 180px;
      vertical-align: middle;
    }

    .multi-select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 4px 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }

    .multi-select.is-open .multi-select-trigger {
      border-color: #888;
    }

    .multi-select-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      max-height: 240px;
      overflow: auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      z-index: 1100;
      padding: 6px 0;
    }

    .multi-select.is-open .multi-select-menu {
      display: block;
    }

    .multi-select-menu label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin: 0;
    }

    .multi-select-menu label:hover {
      background: #f3f3f3;
    }

    .control-group textarea {
      font-family: inherit;
      font-size: 13px;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      min-height: 40px;
      width: 200px;
      vertical-align: middle;
    }

    .school-info-field {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
      vertical-align: middle;
    }

    .school-info-field-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .school-info-clear-btn {
      border: 1px solid #ccc;
      background: #f7f7f7;
      color: #333;
      border-radius: 4px;
      font-size: 12px;
      padding: 2px 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .school-info-clear-btn:hover {
      background: #eee;
    }

    .school-name-two-line {
      display: block;
      line-height: 1.15;
      font-weight: 700;
    }

    .school-name-two-line .school-name-line1 {
      display: block;
      font-family: var(--school-name-line1-font-family, Arial, Helvetica, sans-serif);
      font-size: var(--school-name-line1-font-size, 13px);
    }

    .school-name-two-line .school-name-line2 {
      display: block;
      font-family: var(--school-name-line2-font-family, Arial, Helvetica, sans-serif);
      font-size: var(--school-name-line2-font-size, 11px);
    }

    .settings-json-btn {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #1a2b56;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
    }

    .settings-json-btn:hover {
      background: #243a6e;
    }

    .settings-json-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .settings-json-modal.is-open {
      display: flex;
    }

    .settings-json-dialog {
      background: #fff;
      border-radius: 8px;
      width: min(720px, 100%);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    .settings-json-dialog header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #ddd;
      font-weight: 700;
    }

    .settings-json-dialog pre {
      margin: 0;
      padding: 14px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.4;
      background: #f7f9fc;
      flex: 1;
    }

    .settings-json-dialog footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid #ddd;
    }

    .settings-json-dialog button {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
      font-family: inherit;
    }

    .settings-json-dialog button.primary {
      background: #1a2b56;
      color: #fff;
      border-color: #1a2b56;
    }

    #id-card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      padding: 20px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .id-card {
      width: var(--id-card-width);
      height: var(--id-card-height);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      background: #fff;
      box-sizing: border-box;
      transform: scale(0.95);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .id-card:hover {
      transform: scale(1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .card-identifier {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      color: black;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      z-index: 10;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: var(--bg-image-opacity, 1);
      z-index: 0;
    }

    /* Text Part 50×82mm centered in card; inner padding keeps text 6mm from outer edges */
    .main-content {
      width: var(--id-text-part-width);
      height: var(--id-text-part-height);
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: var(--id-text-part-margin-y) auto;
      padding: var(--id-text-part-padding-y) var(--id-text-part-padding-x);
      border-radius: 10px;
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* View-only print-area guide — outline does not change the box model */
    .show-print-area .main-content {
      outline: 1px solid red;
      outline-offset: -1px;
    }

    .school-info {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      color: #2c3e50;
      padding-bottom: 0;
      border-bottom: none;
      text-align: center;
      margin-bottom: 0;
    }

    .school-logo img {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 0;
      object-fit: cover;
    }

    .school-name {
      font-size: var(--school-name-font-size, 13px);
      font-weight: 700;
      line-height: 1;
      color: var(--school-color);
      flex: 1;
      min-width: 0;
    }

    .school-header-meta {
      text-align: center;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--school-color);
      width: 100%;
    }

    .school-caption,
    .school-affliate,
    .school-address {
      font-size: 7px;
      font-weight: 600;
      font-style: italic;
      color: var(--text-color);
    }

    .school-address {
      font-size: 6px;
      font-weight: bold;
      font-style: normal;
    }

    .staff-photo-area {
      width: var(--staff-photo-height);
      height: var(--staff-photo-height);
      border-radius: var(--staff-photo-border-radius);
      border: 3px solid #fff;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      flex-shrink: 0;
      overflow: hidden;
      margin-top: 5px;
    }

    .staff-photo-area img {
      width: 100%;
      height: 100%;
      object-fit: var(--staff-photo-object-fit, cover);
      display: block;
    }

    .staff-name {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 700;
      color: var(--school-color);
      text-align: center;
      width: 95%;
      line-height: 1.2;
    }

    .designation {
      font-size: 12px;
      font-weight: 600;
      color: #FF5722;
      text-align: center;
      margin-top: 2px;
    }

    .staff-info {
      text-align: left;
      padding: 5px;
      width: 90%;
    }

    .info-row {
      display: flex;
      margin-bottom: 5px;
      font-size: 8px;
      color: #000;
      font-weight: 600;
    }

    .info-label {
      font-weight: 600;
      width: 48px;
      color: var(--school-color);
      flex-shrink: 0;
    }

    .info-devider {
      margin-right: 3px;
    }

    .info-value {
      color: var(--text-color);
      word-break: break-word;
    }

    .principal-signature-area {
      color: #000;
      text-align: center;
      margin-top: auto;
      padding-bottom: 4px;
      flex-shrink: 0;
    }

    .principal-sign {
      margin: -6px;
      min-height: 12px;
    }

    .principal-sign img {
      height: var(--principal-sign-height);
      max-width: 90px;
      object-fit: contain;
    }

    .principal-label {
      font-size: 8px;
      letter-spacing: 0.5px;
      border-top: 1px solid #000;
      color: var(--text-color);
    }

    @media print {
      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        width: 57.2mm !important;
        min-height: 91.5mm;
        height: auto !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .control-bar,
      .settings-json-modal,
      .card-identifier {
        display: none !important;
      }

      #id-card-grid {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
        gap: 0 !important;
      }

      .id-card {
        width: 57.2mm !important;
        height: 91.5mm !important;
        min-width: 57.2mm !important;
        min-height: 91.5mm !important;
        max-width: 57.2mm !important;
        max-height: 91.5mm !important;
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid;
        break-inside: avoid;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        transform: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .bg-image {
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background-size: cover !important;
        background-position: center !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .main-content {
        width: var(--id-text-part-width);
        height: var(--id-text-part-height);
        margin: var(--id-text-part-margin-y) auto;
        padding: var(--id-text-part-padding-y) var(--id-text-part-padding-x);
        box-sizing: border-box;
        outline: none !important;
      }
    }

    @page {
      size: 57.2mm 91.5mm;
      margin: 0;
    }
  </style>
</head>

<body ng-controller="StaffIdCardCtrl" id="page-body">

  <div class="control-bar">
    <div class="control-group">
      <label>Background Image</label>
      <input type="number" id="background-image-id" min="1" max="102" step="1" style="width:70px" />
    </div>
    <div class="control-group">
      <label>BG Opacity</label>
      <input type="number" id="background-image-opacity" min="0" max="1" step="0.1" style="width:70px" />
    </div>
    <div class="control-group">
      <label>Primary Color</label>
      <div id="school-color-picker" class="color-select" data-value="Purple" data-css-var="--school-color"></div>
    </div>
    <div class="control-group">
      <label>Text Color</label>
      <div id="text-color-picker" class="color-select" data-value="Black" data-css-var="--text-color"></div>
    </div>
    <div class="control-group">
      <label>School Name Size</label>
      <input type="number" id="school-name-fontsize" min="6" max="40" step="1" style="width:70px" />
    </div>
    <div class="control-group">
      <label>Photo Height</label>
      <input type="number" id="staff-photo-height" min="40" max="160" step="1" style="width:70px" />
    </div>
    <div class="control-group">
      <label>Photo Border Radius</label>
      <input type="number" id="staff-photo-border-radius" min="0" max="50" step="1" style="width:70px" />
    </div>
    <div class="control-group">
      <label>Photo Fit</label>
      <select id="staff-photo-object-fit">
        <option value="cover">cover</option>
        <option value="fill">fill</option>
      </select>
    </div>
    <div class="control-group">
      <label>Principal Signature</label>
      <input type="text" id="principal-signature-label" style="width:160px" />
    </div>
    <div class="control-group">
      <label>Sign Height</label>
      <input type="number" id="principal-sign-height" min="8" max="60" step="1" style="width:70px" />
    </div>
    <div class="control-group">
      <label>
        <input type="checkbox" id="hide-signature-toggle" />
        Hide Signature
      </label>
    </div>
    <div class="control-group">
      <label>
        <input type="checkbox" id="school-name-twoline-toggle" />
        Two-line School Name
      </label>
    </div>
    <div class="control-panel-extra" id="school-name-twoline-panel">
      <div class="control-group">
        <label>Line 1</label>
        <input type="text" id="school-name-line1" style="width:160px" placeholder="Line 1" />
      </div>
      <div class="control-group">
        <label>Line 1 Font Size</label>
        <input type="number" id="school-name-line1-fontsize" min="6" max="40" step="1" style="width:70px" />
      </div>
      <div class="control-group">
        <label>Line 1 Font Family</label>
        <select id="school-name-line1-fontfamily">
          <option value="Arial, Helvetica, sans-serif">Arial</option>
          <option value="Verdana, Geneva, sans-serif">Verdana</option>
          <option value="Tahoma, Geneva, sans-serif">Tahoma</option>
          <option value='"Trebuchet MS", Helvetica, sans-serif'>Trebuchet MS</option>
          <option value="Georgia, serif">Georgia</option>
          <option value='"Times New Roman", Times, serif'>Times New Roman</option>
        </select>
      </div>
      <div class="control-group">
        <label>Line 2</label>
        <input type="text" id="school-name-line2" style="width:160px" placeholder="Line 2" />
      </div>
      <div class="control-group">
        <label>Line 2 Font Size</label>
        <input type="number" id="school-name-line2-fontsize" min="6" max="40" step="1" style="width:70px" />
      </div>
      <div class="control-group">
        <label>Line 2 Font Family</label>
        <select id="school-name-line2-fontfamily">
          <option value="Arial, Helvetica, sans-serif">Arial</option>
          <option value="Verdana, Geneva, sans-serif">Verdana</option>
          <option value="Tahoma, Geneva, sans-serif">Tahoma</option>
          <option value='"Trebuchet MS", Helvetica, sans-serif'>Trebuchet MS</option>
          <option value="Georgia, serif">Georgia</option>
          <option value='"Times New Roman", Times, serif'>Times New Roman</option>
        </select>
      </div>
    </div>

    <div class="control-group">
      <label>Staff Fields</label>
      <div class="multi-select" id="staff-fields-picker">
        <button type="button" class="multi-select-trigger" id="staff-fields-trigger">
          <span id="staff-fields-summary">All fields</span>
          <span aria-hidden="true">▾</span>
        </button>
        <div class="multi-select-menu" id="staff-fields-menu">
          <label><input type="checkbox" value="Designation" checked /> Designation</label>
          <label><input type="checkbox" value="DateOfBirth" checked /> Date of Birth</label>
          <label><input type="checkbox" value="Mobile" checked /> Mobile</label>
          <label><input type="checkbox" value="Address" checked /> Address</label>
        </div>
      </div>
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="edit-school-info-toggle" />
        Edit School Info
      </label>
    </div>
    <div class="control-panel-extra" id="school-info-edit-panel">
      <div class="control-group">
        <label>Description</label>
        <div class="school-info-field">
          <textarea id="school-info-description" placeholder="School description / caption"></textarea>
          <div class="school-info-field-actions">
            <button type="button" class="school-info-clear-btn" data-clear-school-field="school-info-description">Clear</button>
          </div>
        </div>
      </div>
      <div class="control-group">
        <label>AffiliationInfo</label>
        <div class="school-info-field">
          <textarea id="school-info-affiliation" placeholder="Affiliation info"></textarea>
          <div class="school-info-field-actions">
            <button type="button" class="school-info-clear-btn" data-clear-school-field="school-info-affiliation">Clear</button>
          </div>
        </div>
      </div>
      <div class="control-group">

<script>
const SETTINGS_URL = "https://schoolvertex.github.io/Pages/IdCards/Staff/staff-settings.json";
const DEFAULT_BG_IMAGE = 102;
const SAMPLE_STAFF = {

const commonColors = [
  "Black","White","Gray","Silver","Red","Maroon","Yellow","Olive","Lime","Green",
  "Aqua","Teal","Blue","Navy","Fuchsia","Purple","AliceBlue","AntiqueWhite",
  "Aquamarine","Azure","Beige","Bisque","BlueViolet","Brown","BurlyWood","CadetBlue",
  "Chartreuse","Chocolate","Coral","CornflowerBlue","Crimson","Cyan","DarkBlue",
  "DarkCyan","DarkGoldenRod","DarkGray","DarkGreen","DarkMagenta","DarkOrange",
  "DarkOrchid","DarkRed","DarkSalmon","DarkSeaGreen","DarkSlateBlue","DarkViolet",
  "DeepPink","DeepSkyBlue","DodgerBlue","FireBrick","ForestGreen","Gold","GoldenRod",
  "GreenYellow","HotPink","IndianRed","Indigo","Khaki","Lavender","LightBlue",
  "LightCoral","LightGray","LightGreen","LightPink","LightSalmon","LightSeaGreen",
  "LightSkyBlue","LimeGreen","Magenta","MediumBlue","MediumOrchid","MediumPurple",
  "MediumSeaGreen","MediumVioletRed","MidnightBlue","Olive","Orange","OrangeRed",
  "Orchid","PaleGreen","PaleVioletRed","Peru","Pink","Plum","PowderBlue","RosyBrown",
  "RoyalBlue","SaddleBrown","Salmon","SandyBrown","SeaGreen","Sienna","SkyBlue",
  "SlateBlue","SlateGray","SpringGreen","SteelBlue","Tan","Thistle","Tomato",

];

var DEFAULT_STAFF_FIELDS = ["Designation", "DateOfBirth", "Mobile", "Address"];
var STAFF_FIELD_META = {
  Designation: { label: "Designation", sample: "Teacher" },
  DateOfBirth: { label: "D.O.B", sample: "01 Jun 1988" },
  Mobile: { label: "Mobile", sample: "9390091912" },

};

function getElValue(id, fallback) {
  var el = document.getElementById(id);
  if (!el) return fallback;
  if (el.classList && el.classList.contains("color-select")) {
    return el.getAttribute("data-value") || fallback;
  }
  return el.value !== undefined && el.value !== null && String(el.value) !== "" ? el.value : fallback;
}

function getOrgIdFromQuery() {
  var params = new URLSearchParams(location.search);
  return params.get("orgid") || params.get("orgId") || "151";
}

function resolveColorName(value, fallback) {
  if (!value) return fallback;
  var needle = String(value).toLowerCase();
  for (var i = 0; i < commonColors.length; i++) {
    if (commonColors[i].toLowerCase() === needle) return commonColors[i];
  }
  return String(value);
}

function populateColorDropdown(selectId, savedValue, defaultColor) {
  var root = document.getElementById(selectId);
  if (!root) return;
  root.classList.add("color-select");
  root.innerHTML = "";

  var trigger = document.createElement("button");
  trigger.type = "button";
  trigger.className = "color-select-trigger";
  trigger.innerHTML =
    '<span class="color-swatch"></span>' +
    '<span class="color-select-label"></span>' +
    '<span class="color-select-caret">▾</span>';

  var menu = document.createElement("div");
  menu.className = "color-select-menu";

  commonColors.forEach(function (name) {
    var opt = document.createElement("button");
    opt.type = "button";
    opt.className = "color-select-option";
    opt.dataset.value = name;
    opt.innerHTML =
      '<span class="color-swatch" style="background-color:' + name + ';"></span>' +
      "<span>" + name + "</span>";
    opt.addEventListener("click", function (e) {
      e.stopPropagation();
      setColorSelectValue(selectId, name);
      root.classList.remove("is-open");
      emitCardRefresh();
    });
    menu.appendChild(opt);
  });

  root.appendChild(trigger);
  root.appendChild(menu);

  trigger.addEventListener("click", function (e) {
    e.stopPropagation();
    document.querySelectorAll(".color-select.is-open").forEach(function (el) {
      if (el !== root) el.classList.remove("is-open");
    });
    root.classList.toggle("is-open");
  });

  setColorSelectValue(selectId, savedValue || defaultColor || "Black");
}

function setColorSelectValue(selectId, name) {
  var root = document.getElementById(selectId);
  if (!root) return;
  var resolved = resolveColorName(name, root.getAttribute("data-value") || "Purple");
  var cssVar = root.getAttribute("data-css-var");
  root.setAttribute("data-value", resolved);
  var swatch = root.querySelector(".color-select-trigger .color-swatch");
  var label = root.querySelector(".color-select-label");
  if (swatch) swatch.style.backgroundColor = resolved;
  if (label) label.textContent = resolved;
  root.querySelectorAll(".color-select-option").forEach(function (o) {
    o.classList.toggle("is-selected", String(o.dataset.value).toLowerCase() === resolved.toLowerCase());
  });
  if (cssVar) document.documentElement.style.setProperty(cssVar, resolved);
}

document.addEventListener("click", function () {
  document.querySelectorAll(".color-select.is-open").forEach(function (el) {
    el.classList.remove("is-open");
  });
});

function normalizePhotoObjectFit(v) {
  return String(v || "cover").toLowerCase() === "fill" ? "fill" : "cover";
}

function getBackgroundImageId() {
  var n = parseInt(getElValue("background-image-id", DEFAULT_BG_IMAGE), 10);
  return isNaN(n) ? DEFAULT_BG_IMAGE : n;
}

function getBackgroundOpacity() {
  var n = parseFloat(getElValue("background-image-opacity", "1"));
  if (isNaN(n)) return 1;
  return Math.max(0, Math.min(1, n));
}

function applyBackgroundOpacity(v) {
  var n = parseFloat(v);
  if (isNaN(n)) n = 1;
  n = Math.max(0, Math.min(1, n));
  var input = document.getElementById("background-image-opacity");
  if (input) input.value = String(n);
  document.documentElement.style.setProperty("--bg-image-opacity", String(n));
}

function getPrincipalLabel() {
  return String(getElValue("principal-signature-label", "Principal Signature") || "Principal Signature");
}

function isHideSignature() {
  var toggle = document.getElementById("hide-signature-toggle");
  return !!(toggle && toggle.checked);
}

function isSchoolNameTwoLine() {
  var toggle = document.getElementById("school-name-twoline-toggle");
  return !!(toggle && toggle.checked);
}

function isEditSchoolInfo() {
  var toggle = document.getElementById("edit-school-info-toggle");
  return !!(toggle && toggle.checked);
}

function getSchoolInfoFromControls() {
  return {
    Description: String(getElValue("school-info-description", "") || ""),
    AffiliationInfo: String(getElValue("school-info-affiliation", "") || ""),
    FullAddress: String(getElValue("school-info-address", "") || ""),
    Mobile: String(getElValue("school-info-mobile", "") || "")
  };
}

function setSchoolInfoControls(info) {
  info = info || {};
  var desc = document.getElementById("school-info-description");
  var aff = document.getElementById("school-info-affiliation");
  var addr = document.getElementById("school-info-address");
  var mobile = document.getElementById("school-info-mobile");
  if (desc && info.Description !== undefined) desc.value = info.Description;
  if (aff && info.AffiliationInfo !== undefined) aff.value = info.AffiliationInfo;
  if (addr && info.FullAddress !== undefined) addr.value = info.FullAddress;
  if (mobile && info.Mobile !== undefined) mobile.value = info.Mobile;
}

var schoolInfoUserManaged = false;

function getSelectedStaffFields() {
  var menu = document.getElementById("staff-fields-menu");
  if (!menu) return DEFAULT_STAFF_FIELDS.slice();
  var selected = [];
  menu.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
    if (cb.checked) selected.push(cb.value);
  });
  return selected;
}

function setSelectedStaffFields(fields) {
  var wanted = Array.isArray(fields) && fields.length ? fields.map(String) : DEFAULT_STAFF_FIELDS.slice();
  var menu = document.getElementById("staff-fields-menu");
  if (!menu) return;
  menu.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
    cb.checked = wanted.indexOf(cb.value) !== -1;
  });
  updateStaffFieldsSummary();
}

function updateStaffFieldsSummary() {
  var summary = document.getElementById("staff-fields-summary");
  if (!summary) return;
  var selected = getSelectedStaffFields();
  if (!selected.length) summary.textContent = "None";
  else if (selected.length === DEFAULT_STAFF_FIELDS.length) summary.textContent = "All fields";
  else summary.textContent = selected.length + " selected";
}

function splitSchoolNameFallback(name) {
  if (!name) return { line1: "", line2: "" };
  var match = String(name).match(/^(.*?)\s+(International\s+School.*)$/i);
  if (match) return { line1: match[1], line2: match[2] };
  var parts = String(name).trim().split(/\s+/);
  if (parts.length > 2) {
    return { line1: parts.slice(0, 2).join(" "), line2: parts.slice(2).join(" ") };
  }
  return { line1: name, line2: "" };
}

function getSchoolNameLines(fallbackName) {
  var line1El = document.getElementById("school-name-line1");
  var line2El = document.getElementById("school-name-line2");
  var line1 = line1El ? line1El.value : "";
  var line2 = line2El ? line2El.value : "";
  if (!line1) {
    var parts = splitSchoolNameFallback(fallbackName || "");
    line1 = parts.line1;
    if (!line2) line2 = parts.line2;
  }
  if (line2 == null) line2 = "";
  return { line1: line1, line2: line2 };
}

function applySchoolNameLineStyles() {
  document.documentElement.style.setProperty("--school-name-line1-font-size", getElValue("school-name-line1-fontsize", "13") + "px");
  document.documentElement.style.setProperty("--school-name-line1-font-family", getElValue("school-name-line1-fontfamily", "Arial, Helvetica, sans-serif"));
  document.documentElement.style.setProperty("--school-name-line2-font-size", getElValue("school-name-line2-fontsize", "11") + "px");
  document.documentElement.style.setProperty("--school-name-line2-font-family", getElValue("school-name-line2-fontfamily", "Arial, Helvetica, sans-serif"));
}

function emitCardRefresh() {
  window.dispatchEvent(new CustomEvent("idcard-schoolname-change"));
}

function buildCurrentSettingsJson() {
  var settings = {
    PrimaryColor: getElValue("school-color-picker", "Purple"),
    TextColor: getElValue("text-color-picker", "Black"),
    SchoolNameSize: parseInt(getElValue("school-name-fontsize", "13"), 10),
    PhotoHeight: parseInt(getElValue("staff-photo-height", "100"), 10),
    PhotoBorderRadius: parseInt(getElValue("staff-photo-border-radius", "50"), 10),
    PhotoObjectFit: normalizePhotoObjectFit(getElValue("staff-photo-object-fit", "cover")),
    BackgroundImage: getBackgroundImageId(),
    BackgroundOpacity: getBackgroundOpacity(),
    PrincipalSignature: getPrincipalLabel(),
    PrincipalSignHeight: parseInt(getElValue("principal-sign-height", "20"), 10),
    HideSignature: isHideSignature(),
    SchoolNameTwoLine: isSchoolNameTwoLine(),
    StaffFields: getSelectedStaffFields()
  };
  if (settings.SchoolNameTwoLine) {
    var lines = getSchoolNameLines((window.__idCardOrg && window.__idCardOrg.Name) || "");
    settings.SchoolNameLine1 = lines.line1;
    settings.SchoolNameLine2 = lines.line2;
    settings.SchoolNameLine1FontSize = parseInt(getElValue("school-name-line1-fontsize", "13"), 10);
    settings.SchoolNameLine1FontFamily = getElValue("school-name-line1-fontfamily", "Arial, Helvetica, sans-serif");
    settings.SchoolNameLine2FontSize = parseInt(getElValue("school-name-line2-fontsize", "11"), 10);
    settings.SchoolNameLine2FontFamily = getElValue("school-name-line2-fontfamily", "Arial, Helvetica, sans-serif");
  }
  if (isEditSchoolInfo()) {
    var schoolInfo = getSchoolInfoFromControls();
    settings.SchoolDescription = schoolInfo.Description;
    settings.SchoolAffiliationInfo = schoolInfo.AffiliationInfo;
    settings.SchoolFullAddress = schoolInfo.FullAddress;
    settings.SchoolMobile = schoolInfo.Mobile;
  }
  return settings;
}

function openSettingsJsonModal() {
  var modal = document.getElementById("settings-json-modal");
  var preview = document.getElementById("settings-json-preview");
  preview.textContent = JSON.stringify(buildCurrentSettingsJson(), null, 2);
  modal.classList.add("is-open");
  modal.setAttribute("aria-hidden", "false");
}

function closeSettingsJsonModal() {
  var modal = document.getElementById("settings-json-modal");
  modal.classList.remove("is-open");
  modal.setAttribute("aria-hidden", "true");
}

async function copySettingsJson() {
  var text = document.getElementById("settings-json-preview").textContent;
  try {
    await navigator.clipboard.writeText(text);
    var btn = document.getElementById("settings-json-copy");
    var old = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(function () { btn.textContent = old; }, 1200);
  } catch (e) {
    prompt("Copy this settings JSON:", text);
  }
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatDob(value) {
  if (!value) return "";
  try {
    var d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var dd = String(d.getDate()).padStart(2, "0");
    return dd + " " + months[d.getMonth()] + " " + d.getFullYear();
  } catch (e) {
    return String(value);
  }
}

function applyConfig(config) {
  config = config || {};
  if (config.PrimaryColor) {
    var primary = resolveColorName(config.PrimaryColor, "Purple");
    setColorSelectValue("school-color-picker", primary);
    document.documentElement.style.setProperty("--school-color", primary);
  }
  if (config.TextColor) {
    var text = resolveColorName(config.TextColor, "Black");
    setColorSelectValue("text-color-picker", text);
    document.documentElement.style.setProperty("--text-color", text);
  }

  if (config.SchoolNameSize != null) {
    var size = String(config.SchoolNameSize).replace(/px$/i, "");
    document.getElementById("school-name-fontsize").value = size;
    document.documentElement.style.setProperty("--school-name-font-size", size + "px");
  }
  if (config.PhotoHeight != null) {
    document.getElementById("staff-photo-height").value = String(config.PhotoHeight);
    document.documentElement.style.setProperty("--staff-photo-height", config.PhotoHeight + "px");
  }
  if (config.PhotoBorderRadius != null) {
    document.getElementById("staff-photo-border-radius").value = String(config.PhotoBorderRadius);
    document.documentElement.style.setProperty("--staff-photo-border-radius", config.PhotoBorderRadius + "%");
  }
  if (config.PhotoObjectFit || config.PhotoFit) {
    document.getElementById("staff-photo-object-fit").value = normalizePhotoObjectFit(config.PhotoObjectFit || config.PhotoFit);
    document.documentElement.style.setProperty("--staff-photo-object-fit", normalizePhotoObjectFit(config.PhotoObjectFit || config.PhotoFit));
  }
  if (config.BackgroundImage != null) {
    document.getElementById("background-image-id").value = String(config.BackgroundImage);
  }
  if (config.BackgroundOpacity != null && config.BackgroundOpacity !== "") {
    applyBackgroundOpacity(config.BackgroundOpacity);
  }
  if (config.PrincipalSignature || config.PrincipalLabel) {
    document.getElementById("principal-signature-label").value = config.PrincipalSignature || config.PrincipalLabel;
  }
  if (config.PrincipalSignHeight != null) {
    document.getElementById("principal-sign-height").value = String(config.PrincipalSignHeight);
    document.documentElement.style.setProperty("--principal-sign-height", config.PrincipalSignHeight + "px");
  }
  document.getElementById("hide-signature-toggle").checked =
    config.HideSignature === true || config.HideSignature === 1 || config.HideSignature === "true";

  var twoLine = config.SchoolNameTwoLine === true || config.SchoolNameTwoLine === 1 || config.SchoolNameTwoLine === "true";
  document.getElementById("school-name-twoline-toggle").checked = twoLine;
  document.getElementById("school-name-twoline-panel").classList.toggle("is-open", twoLine);
  if (twoLine) {
    if (config.SchoolNameLine1 != null) document.getElementById("school-name-line1").value = config.SchoolNameLine1;
    if (config.SchoolNameLine2 != null) document.getElementById("school-name-line2").value = config.SchoolNameLine2;
    if (config.SchoolNameLine1FontSize != null) document.getElementById("school-name-line1-fontsize").value = config.SchoolNameLine1FontSize;
    if (config.SchoolNameLine1FontFamily != null) document.getElementById("school-name-line1-fontfamily").value = config.SchoolNameLine1FontFamily;
    if (config.SchoolNameLine2FontSize != null) document.getElementById("school-name-line2-fontsize").value = config.SchoolNameLine2FontSize;
    if (config.SchoolNameLine2FontFamily != null) document.getElementById("school-name-line2-fontfamily").value = config.SchoolNameLine2FontFamily;
    applySchoolNameLineStyles();
  }

  if (config.StaffFields != null) setSelectedStaffFields(config.StaffFields);
  else setSelectedStaffFields(DEFAULT_STAFF_FIELDS);

  var hasSchool =
    config.SchoolDescription !== undefined ||
    config.SchoolAffiliationInfo !== undefined ||
    config.SchoolFullAddress !== undefined ||
    config.SchoolMobile !== undefined;
  if (hasSchool) {
    document.getElementById("edit-school-info-toggle").checked = true;
    document.getElementById("school-info-edit-panel").classList.add("is-open");
    setSchoolInfoControls({
      Description: config.SchoolDescription != null ? config.SchoolDescription : "",
      AffiliationInfo: config.SchoolAffiliationInfo != null ? config.SchoolAffiliationInfo : "",
      FullAddress: config.SchoolFullAddress != null ? config.SchoolFullAddress : "",
      Mobile: config.SchoolMobile != null ? config.SchoolMobile : ""
    });
    schoolInfoUserManaged = true;
  }

  emitCardRefresh();
}

function setupPickers() {
  populateColorDropdown("school-color-picker", "Purple", "Purple");
  populateColorDropdown("text-color-picker", "Black", "Black");
  document.documentElement.style.setProperty("--school-color", "Purple");
  document.documentElement.style.setProperty("--text-color", "Black");

  document.getElementById("background-image-id").value = String(DEFAULT_BG_IMAGE);
  applyBackgroundOpacity(1);
  document.getElementById("background-image-opacity").addEventListener("input", function (e) {
    applyBackgroundOpacity(e.target.value);
    emitCardRefresh();
  });
  document.getElementById("background-image-id").addEventListener("change", emitCardRefresh);

  document.getElementById("school-name-fontsize").value = "13";
  document.documentElement.style.setProperty("--school-name-font-size", "13px");
  document.getElementById("school-name-fontsize").addEventListener("input", function (e) {
    document.documentElement.style.setProperty("--school-name-font-size", e.target.value + "px");
  });

  document.getElementById("staff-photo-height").value = "100";
  document.documentElement.style.setProperty("--staff-photo-height", "100px");
  document.getElementById("staff-photo-height").addEventListener("input", function (e) {
    document.documentElement.style.setProperty("--staff-photo-height", e.target.value + "px");
  });

  document.getElementById("staff-photo-border-radius").value = "50";
  document.documentElement.style.setProperty("--staff-photo-border-radius", "50%");
  document.getElementById("staff-photo-border-radius").addEventListener("input", function (e) {
    document.documentElement.style.setProperty("--staff-photo-border-radius", e.target.value + "%");
  });

  document.getElementById("staff-photo-object-fit").value = "cover";
  document.documentElement.style.setProperty("--staff-photo-object-fit", "cover");
  document.getElementById("staff-photo-object-fit").addEventListener("change", function (e) {
    document.documentElement.style.setProperty("--staff-photo-object-fit", normalizePhotoObjectFit(e.target.value));
  });

  document.getElementById("principal-signature-label").value = "Principal Signature";
  document.getElementById("principal-sign-height").value = "20";
  document.documentElement.style.setProperty("--principal-sign-height", "20px");
  document.getElementById("principal-sign-height").addEventListener("input", function (e) {
    document.documentElement.style.setProperty("--principal-sign-height", e.target.value + "px");
  });
  document.getElementById("hide-signature-toggle").addEventListener("change", emitCardRefresh);

  var twoLineToggle = document.getElementById("school-name-twoline-toggle");
  var twoLinePanel = document.getElementById("school-name-twoline-panel");
  var line1Input = document.getElementById("school-name-line1");
  var line2Input = document.getElementById("school-name-line2");
  document.getElementById("school-name-line1-fontsize").value = "13";
  document.getElementById("school-name-line2-fontsize").value = "11";

  function fillSplitIntoLineInputs() {
    var orgName = (window.__idCardOrg && window.__idCardOrg.Name) || "";
    var parts = splitSchoolNameFallback(orgName);
    line1Input.value = parts.line1;
    line2Input.value = parts.line2;
  }

  twoLineToggle.addEventListener("change", function () {
    var enabled = twoLineToggle.checked;
    twoLinePanel.classList.toggle("is-open", enabled);
    if (enabled) {
      fillSplitIntoLineInputs();
      applySchoolNameLineStyles();
    }
    emitCardRefresh();
  });
  ["school-name-line1", "school-name-line2", "school-name-line1-fontsize", "school-name-line1-fontfamily", "school-name-line2-fontsize", "school-name-line2-fontfamily"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", function () { applySchoolNameLineStyles(); emitCardRefresh(); });
    el.addEventListener("change", function () { applySchoolNameLineStyles(); emitCardRefresh(); });
  });

  setSelectedStaffFields(DEFAULT_STAFF_FIELDS);
  var staffFieldsPicker = document.getElementById("staff-fields-picker");
  var staffFieldsTrigger = document.getElementById("staff-fields-trigger");
  var staffFieldsMenu = document.getElementById("staff-fields-menu");
  staffFieldsTrigger.addEventListener("click", function (e) {
    e.stopPropagation();
    staffFieldsPicker.classList.toggle("is-open");
  });
  staffFieldsMenu.addEventListener("click", function (e) { e.stopPropagation(); });
  staffFieldsMenu.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
    cb.addEventListener("change", function () {
      updateStaffFieldsSummary();
      emitCardRefresh();
    });
  });
  document.addEventListener("click", function () {
    staffFieldsPicker.classList.remove("is-open");
  });

  var editSchoolInfoToggle = document.getElementById("edit-school-info-toggle");
  var schoolInfoPanel = document.getElementById("school-info-edit-panel");
  editSchoolInfoToggle.addEventListener("change", function (e) {
    schoolInfoPanel.classList.toggle("is-open", e.target.checked);
    emitCardRefresh();
  });
  document.querySelectorAll("[data-clear-school-field]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var fieldId = btn.getAttribute("data-clear-school-field");
      var el = document.getElementById(fieldId);
      if (el) el.value = "";
      schoolInfoUserManaged = true;
      emitCardRefresh();
    });
  });
  ["school-info-description", "school-info-affiliation", "school-info-address", "school-info-mobile"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("input", function () {
      schoolInfoUserManaged = true;
      emitCardRefresh();
    });
  });

  var showPrintAreaToggle = document.getElementById("show-print-area-toggle");
  showPrintAreaToggle.checked = false;
  showPrintAreaToggle.addEventListener("change", function () {
    document.getElementById("page-body").classList.toggle("show-print-area", showPrintAreaToggle.checked);
  });

  document.getElementById("show-settings-json-btn").addEventListener("click", openSettingsJsonModal);
  document.getElementById("settings-json-close").addEventListener("click", closeSettingsJsonModal);
  document.getElementById("settings-json-close-2").addEventListener("click", closeSettingsJsonModal);
  document.getElementById("settings-json-copy").addEventListener("click", copySettingsJson);
  document.getElementById("settings-json-modal").addEventListener("click", function (e) {
    if (e.target === this) closeSettingsJsonModal();
  });

  loadSettings();
}

async function loadSettings() {
  try {
    var orgId = getOrgIdFromQuery();
    var res = await fetch(SETTINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    var data = await res.json();
    var config = Object.assign({}, data["All"] || {}, data[orgId] || data[String(orgId)] || {});
    applyConfig(config);
    console.log("Loaded staff settings for orgId=" + orgId, config);
  } catch (err) {
    console.error("Failed to load staff-settings.json — using defaults:", err);
  }
}

document.addEventListener("DOMContentLoaded", setupPickers);

angular.module("myApp", ["ngSanitize"])
.controller("StaffIdCardCtrl", function ($scope, $http, $sce) {
  var designBaseUrl = "https://cdn.jsdelivr.net/gh/gitcdnsv/svcdn/IdCardBg/";
  var orgData = null;

  function getDisplayOrg(org) {
    org = Object.assign({}, org || {});
    if (isEditSchoolInfo()) {
      var o = getSchoolInfoFromControls();
      org.Description = o.Description;
      org.AffiliationInfo = o.AffiliationInfo;
      org.fullAddress = o.FullAddress;
      org.FullAddress = o.FullAddress;
      org.Mobile = o.Mobile;
    } else {
      if (org.FullAddress) org.fullAddress = org.FullAddress;
      else if (org.AddressInfo) {
        var a = org.AddressInfo;
        org.fullAddress = [a.Plot_HouseNumber, a.LandMark, a.Street, a.City, a.State, a.ZipCode].filter(Boolean).join(", ");
      }
    }
    return org;
  }

  function renderSchoolNameHtml(name) {
    if (isSchoolNameTwoLine()) {
      var lines = getSchoolNameLines(name);
      return '<span class="school-name-two-line">' +
        '<span class="school-name-line1">' + escapeHtml(lines.line1) + "</span>" +
        (lines.line2 ? '<span class="school-name-line2">' + escapeHtml(lines.line2) + "</span>" : "") +
        "</span>";
    }
    return escapeHtml(name || "");
  }

  function renderStaffInfoRows(staff) {
    var fields = getSelectedStaffFields();
    var html = "";
    fields.forEach(function (key) {
      var meta = STAFF_FIELD_META[key];
      if (!meta) return;
      var value = "";
      if (key === "Designation") {
        // shown separately under name
        return;
      }
      if (key === "DateOfBirth") value = formatDob(staff.DateOfBirth);
      else if (key === "Mobile") value = staff.Mobile || meta.sample;
      else if (key === "Address") value = staff.Address || meta.sample;
      else value = staff[key] || meta.sample;
      if (!value) return;
      html +=
        '<div class="info-row">' +
        '<div class="info-label">' + escapeHtml(meta.label) + "</div>" +
        '<div class="info-devider">:</div>' +
        '<div class="info-value">' + escapeHtml(value) + "</div>" +
        "</div>";
    });
    return html;
  }

  function renderDesignation(staff) {
    if (getSelectedStaffFields().indexOf("Designation") === -1) return "";
    var value = staff.Designation || STAFF_FIELD_META.Designation.sample;
    if (!value) return "";
    return '<div class="designation">' + escapeHtml(value) + "</div>";
  }

  function renderSignature(org) {
    if (isHideSignature()) return "";
    var sign = org && org.Sign ? String(org.Sign).trim() : "";
    var signHtml = sign
      ? '<div class="principal-sign"><img src="' + escapeHtml(sign) + '" alt="Signature"></div>'
      : '<div class="principal-sign"></div>';
    return (
      '<div class="principal-signature-area">' +
      signHtml +
      '<div class="principal-label">' + escapeHtml(getPrincipalLabel()) + "</div>" +
      "</div>"
    );
  }

  function buildCard(org, bgIndex) {
    org = getDisplayOrg(org);
    var staff = SAMPLE_STAFF;
    var bgUrl = designBaseUrl + bgIndex + ".jpg";
    return (
      '<div class="id-card">' +
      '<div class="card-identifier">' + bgIndex + "</div>" +
      '<div class="bg-image" style="background-image:url(\'' + bgUrl + "');\"></div>" +
      '<div class="main-content">' +
      '<div class="school-info">' +
      '<div class="school-logo"><img src="' + escapeHtml(org.Image || "") + '" alt="School Logo"></div>' +
      '<div class="school-name">' + renderSchoolNameHtml(org.Name) + "</div>" +
      "</div>" +
      '<div class="school-header-meta">' +
      (org.Description ? '<p class="school-affliate">' + escapeHtml(org.Description) + "</p>" : "") +
      (org.AffiliationInfo ? '<p class="school-affliate">' + escapeHtml(org.AffiliationInfo) + "</p>" : "") +
      (org.fullAddress ? '<p class="school-address">' + escapeHtml(org.fullAddress) + "</p>" : "") +
      (org.Mobile ? '<p class="school-address">PHONE: ' + escapeHtml(org.Mobile) + "</p>" : "") +
      "</div>" +
      '<div class="staff-photo-area"><img src="' + escapeHtml(staff.Image) + '" alt="Staff Photo"></div>' +
      '<div class="staff-name">' + escapeHtml(staff.Name) + "</div>" +
      renderDesignation(staff) +
      '<div class="staff-info">' + renderStaffInfoRows(staff) + "</div>" +
      renderSignature(org) +
      "</div></div>"
    );
  }

  function buildCards(org) {
    orgData = org || {};
    window.__idCardOrg = orgData;
    if (!schoolInfoUserManaged && !isEditSchoolInfo()) {
      setSchoolInfoControls({
        Description: orgData.Description || "",
        AffiliationInfo: orgData.AffiliationInfo || orgData.Affiliation || "",
        FullAddress: orgData.FullAddress || orgData.fullAddress || "",
        Mobile: orgData.Mobile || ""
      });
    }
    var bgId = getBackgroundImageId();
    var html = buildCard(orgData, bgId);
    // Show a few nearby backgrounds for preview variety
    for (var i = 1; i <= 3; i++) {
      var n = ((bgId - 1 + i) % 102) + 1;
      html += buildCard(orgData, n);
    }
    $scope.cardsHtml = $sce.trustAsHtml(html);
    if (!$scope.$$phase) $scope.$applyAsync();
  }

  window.addEventListener("idcard-schoolname-change", function () {
    if (orgData) buildCards(orgData);
  });

  var orgId = getOrgIdFromQuery();
  $http.get("https://api.schoolvertex.com/api/Organisation/GetInfoForCertificate/" + orgId)
    .then(function (res) {
      buildCards(res.data || {});
    }, function () {
      buildCards({
        Name: "Sample School",
        Description: "Recognized by the Govt",
        AffiliationInfo: "CBSE Curriculum",
        FullAddress: "Hyderabad",
        Mobile: "9000000000",
        Image: ""
      });
    });
});
</script>
</body>
</html>
